name: Evolve Candidate
description: Suggest a candidate for Bernstein's community evolution queue
title: "[Evolve] "
body:
  - type: markdown
    attributes:
      value: |
        Maintainers can opt this proposal into evolution by applying the
        `evolve-candidate` label. The community evolution scanner requires a
        collaborator author or the `maintainer-approved` label.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is frustrating today? What can't you do?
    validations:
      required: true
  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed solution
      description: How should it work? CLI examples or a sketch are welcome.
  - type: textarea
    id: impact
    attributes:
      label: Impact
      description: Who benefits, and how?
  - type: textarea
    id: risk
    attributes:
      label: Risk
      description: Consider breaking changes, security, and performance.
  - type: dropdown
    id: effort
    attributes:
      label: Effort
      options: ["S", "M", "L"]
