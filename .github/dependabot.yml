# Dependabot configuration. Without this file only ad-hoc security PRs can
# appear; version updates never run, which left dependabot-auto-merge.yml
# with nothing to act on. Updates are weekly and grouped so the maintainer
# sees one PR per ecosystem, not one per package; patch/minor groups are
# auto-enqueued by .github/workflows/dependabot-auto-merge.yml and gated by
# the same merge-queue CI as any other change.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    # A week's cooldown before proposing a new release: a compromised
    # package is usually yanked within days, so not tracking the bleeding
    # edge is itself a supply-chain control (zizmor: dependabot-cooldown).
    cooldown:
      default-days: 7
    groups:
      actions-minor-and-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]
    labels:
      - "dependencies"
      - "ci"

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    cooldown:
      default-days: 7
    groups:
      python-minor-and-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]
    labels:
      - "dependencies"
    ignore:
      # mkdocs-redirects 1.2.3 swapped its `mkdocs` dependency for
      # `properdocs`, a third-party fork of mkdocs 1.x. The docs build targets
      # upstream mkdocs, so the cap in docs/requirements.in is a decision
      # rather than a stale pin - a grouped version update lifted it once
      # already, which is how the fork nearly arrived as a transitive
      # dependency of the docs toolchain. Revisit by editing the cap, not by
      # letting a bump edit it.
      - dependency-name: "mkdocs-redirects"
        versions: [">=1.2.3"]
    # Majors stay individual PRs for a human decision.
    open-pull-requests-limit: 10
