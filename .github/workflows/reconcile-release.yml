name: Reconcile release drift

# Daily safety net for the silent-skip class of bugs (#1273).
# If `pyproject.toml` on main declares a version that a published channel does
# NOT yet have AND the version commit is older than ~24h, something upstream
# (CI / auto-release / a publish job) silently dropped that channel. Open a
# tracking issue for the operator. Re-running on the same day must not spam.
#
# The comparison set covers every channel the publish chain writes to, because
# a channel nobody compares cannot be seen to fall behind (#3322, #3323):
#   * PyPI                  - the sdist/wheel line
#   * Copr                  - the RPM channel
#   * npm                   - the `bernstein-orchestrator` wrapper
#   * Homebrew tap          - the formula's pinned version
#   * GitHub Release assets - dist artefacts and both SBOMs
#
# A channel this run could not read is reported as `unknown`, kept out of the
# drift verdict, and named in `unknown_channels`. `unknown` is not `level`: a
# run carrying any unknown channel neither auto-closes drift issues nor ends
# green, because a detector that reports success for what it never checked is
# the same silent-skip failure it exists to catch.

on:
  schedule:
    # 04:11 UTC - off-hour, off-pattern so it doesn't collide with
    # the rest of the nightly cron herd at :00.
    - cron: "11 4 * * *"
  workflow_dispatch:

concurrency:
  group: reconcile-release
  cancel-in-progress: false

permissions: {}

jobs:
  reconcile:
    name: Compare pyproject.toml vs published channels
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Harden runner (audit mode)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"

      - name: Compare versions and release assets
        id: cmp
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY' >> "${GITHUB_OUTPUT}"
          import json
          import os
          import re
          import subprocess
          import sys
          import urllib.error
          import urllib.request

          USER_AGENT = "bernstein-reconcile-release"
          # Both SBOMs are attached to every release by `.github/workflows/sbom.yml`.
          SBOM_ASSETS = ("bernstein.spdx.json", "bernstein.cyclonedx.json")

          # Channels this run could not read. A channel in here was not compared,
          # so the run says nothing about it: it must not be counted as evidence
          # that the channel is level, and the run must not end green pretending
          # the reconciliation happened.
          unresolved: list[str] = []

          def annotate(text: str) -> None:
              # This step's stdout is redirected into GITHUB_OUTPUT, where a
              # workflow command is just an unparsed line in a file. Annotations
              # go to stderr so the runner actually renders them.
              print(text, file=sys.stderr)

          def unreadable(label: str, reason: object) -> None:
              unresolved.append(label)
              annotate(
                  f"::error::could not read the {label} channel state ({reason}); "
                  f"{label} was NOT checked this run"
              )

          def parse_version(s: str) -> tuple[int, ...]:
              # Tolerant tuple-of-ints parse. Pre-release suffixes (-rc1, .dev0)
              # get stripped; we only need ordering on the public release line.
              core = re.split(r"[^0-9.]", s, maxsplit=1)[0].strip(".")
              return tuple(int(p) for p in core.split(".") if p.isdigit())

          def probe(label, url, extract, accept="application/json"):
              # Read one channel's current version, or "unknown" when the channel
              # cannot be read. Same bargain the Copr lookup below makes: one
              # registry's outage must not take the rest of the comparison down
              # with it. What "unknown" must never mean is "fine": the label is
              # recorded in `unresolved`, which gates the auto-close step and
              # fails the run at the end.
              try:
                  req = urllib.request.Request(
                      url, headers={"User-Agent": USER_AGENT, "Accept": accept}
                  )
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      return extract(resp.read())
              except (urllib.error.URLError, TimeoutError, ValueError, KeyError, OSError, TypeError) as exc:
                  unreadable(label, exc)
                  return "unknown"

          # Read pyproject.toml version from the checked-out tree (main).
          with open("pyproject.toml", encoding="utf-8") as fh:
              pj_text = fh.read()
          m = re.search(r'(?m)^version = "([^"]+)"', pj_text)
          if not m:
              annotate("::error::pyproject.toml has no `version = \"...\"` line")
              sys.exit(1)
          pj_version = m.group(1)

          # Fetch latest published version from PyPI JSON API.
          req = urllib.request.Request(
              "https://pypi.org/pypi/bernstein/json",
              headers={"User-Agent": "bernstein-reconcile-release"},
          )
          with urllib.request.urlopen(req, timeout=30) as resp:
              pypi_payload = json.load(resp)
          pypi_version = pypi_payload["info"]["version"]

          # Fetch the latest RPM the Copr build service holds. The RPM channel
          # leaves no artefact in this repository, so this reconciliation is
          # the only place a dropped publish becomes visible (#3325).
          copr_version = "unknown"
          copr_api = (
              "https://copr.fedorainfracloud.org/api_3/package"
              "?ownername=alexchernysh&projectname=bernstein"
              "&packagename=bernstein&with_latest_build=true"
          )
          try:
              copr_req = urllib.request.Request(
                  copr_api,
                  headers={"User-Agent": "bernstein-reconcile-release"},
              )
              with urllib.request.urlopen(copr_req, timeout=30) as resp:
                  copr_payload = json.load(resp)
              latest_build = copr_payload["builds"]["latest"]
              # Copr versions carry the RPM release suffix ("3.12.0-1").
              copr_version = str(latest_build["source_package"]["version"]).split("-", 1)[0]
          except (urllib.error.URLError, TimeoutError, ValueError, KeyError, OSError, TypeError) as exc:
              # A Copr outage must not take the PyPI comparison down with it, but
              # it must not pass for a clean read of the RPM channel either.
              unreadable("copr", exc)

          # npm wrapper. publish.yml versions packaging/npm straight from the
          # release tag, so the `latest` dist-tag tracks the same line as
          # pyproject.toml; anything older means a publish was dropped (#3322).
          npm_version = probe(
              "npm",
              "https://registry.npmjs.org/bernstein-orchestrator",
              lambda raw: str(json.loads(raw)["dist-tags"]["latest"]),
              accept="application/vnd.npm.install-v1+json",
          )

          # Homebrew tap formula. The formula pins the PyPI sdist of the version
          # it serves, so the URL carries the version the tap is on (#3323).
          def _tap_version(raw: bytes) -> str:
              found = re.search(r"bernstein-([0-9][0-9A-Za-z.\-]*)\.tar\.gz", raw.decode("utf-8"))
              if found is None:
                  raise ValueError("tap formula has no bernstein-<version>.tar.gz url")
              return found.group(1)

          brew_version = probe(
              "Homebrew tap",
              "https://raw.githubusercontent.com/chernistry/homebrew-tap/HEAD/Formula/bernstein.rb",
              _tap_version,
              accept="text/plain",
          )

          pj_t = parse_version(pj_version)
          pypi_t = parse_version(pypi_version)

          release_tag = f"v{pj_version}"
          release_assets = subprocess.run(
              [
                  "gh",
                  "release",
                  "view",
                  release_tag,
                  "--repo",
                  os.environ["REPO"],
                  "--json",
                  "assets",
                  "--jq",
                  "[.assets[].name]",
              ],
              check=False,
              capture_output=True,
              text=True,
          )
          # `gh release view` exits non-zero both for "this release does not
          # exist" and for "the API could not be reached". Only the first says
          # anything about the release; collapsing the two would report an
          # outage as a release with no assets.
          release_stderr = (release_assets.stderr or "").strip()
          release_known = True
          release_exists = release_assets.returncode == 0
          if not release_exists and "release not found" not in release_stderr.lower():
              release_known = False
              unreadable("github-release", release_stderr or f"gh exit {release_assets.returncode}")
          asset_names = []
          if release_exists:
              try:
                  asset_names = json.loads(release_assets.stdout.strip() or "[]")
              except json.JSONDecodeError:
                  annotate(f"::error::could not parse GitHub Release asset list for {release_tag}")
                  sys.exit(1)
          asset_count = len(asset_names)
          absent_sboms = [name for name in SBOM_ASSETS if name not in asset_names]

          # Age of the pyproject.toml change (when did the version line last move?).
          # We use git blame on the version line; the diff threshold is >24h.
          blame = subprocess.run(
              ["git", "log", "-1", "--format=%ct", "--", "pyproject.toml"],
              check=True, capture_output=True, text=True,
          ).stdout.strip()
          pj_age_seconds = int(subprocess.run(
              ["date", "+%s"], check=True, capture_output=True, text=True,
          ).stdout.strip()) - int(blame)
          pj_age_hours = pj_age_seconds // 3600

          print(f"pj_version={pj_version}")
          print(f"pypi_version={pypi_version}")
          print(f"copr_version={copr_version}")
          print(f"npm_version={npm_version}")
          print(f"brew_version={brew_version}")
          print(f"pj_age_hours={pj_age_hours}")
          print(f"release_exists={'true' if release_exists else 'false'}")
          print(f"asset_count={asset_count}")
          print(f"absent_sboms={','.join(absent_sboms) if absent_sboms else '-'}")

          # A channel is only "behind" once the bump has had a full publish
          # window to land, so every version comparison shares the age gate.
          settled = pj_age_hours >= 24
          version_drift = pj_t > pypi_t and settled
          missing_assets = release_known and release_exists and asset_count == 0
          # An unreadable channel state is reported as a warning above, not as
          # drift: it says nothing about what the channel actually holds.
          copr_drift = (
              copr_version != "unknown"
              and pj_t > parse_version(copr_version)
              and settled
          )
          npm_drift = npm_version != "unknown" and pj_t > parse_version(npm_version) and settled
          brew_drift = brew_version != "unknown" and pj_t > parse_version(brew_version) and settled
          missing_sboms = release_known and release_exists and settled and bool(absent_sboms)
          print(f"version_drift={'true' if version_drift else 'false'}")
          print(f"missing_assets={'true' if missing_assets else 'false'}")
          print(f"copr_drift={'true' if copr_drift else 'false'}")
          print(f"npm_drift={'true' if npm_drift else 'false'}")
          print(f"brew_drift={'true' if brew_drift else 'false'}")
          print(f"missing_sboms={'true' if missing_sboms else 'false'}")

          drift = version_drift or missing_assets or copr_drift or npm_drift or brew_drift or missing_sboms
          print(f"drift={'true' if drift else 'false'}")

          # Name the channels that are behind so the tracking issue points at
          # the one that needs attention instead of at "the release".
          behind = [
              label
              for label, flagged in (
                  ("pypi", version_drift),
                  ("release-assets", missing_assets),
                  ("copr", copr_drift),
                  ("npm", npm_drift),
                  ("homebrew", brew_drift),
                  ("sbom", missing_sboms),
              )
              if flagged
          ]
          print(f"behind={','.join(behind) if behind else '-'}")

          # `drift=false` alone is not evidence that the release is level: it is
          # also what an unreadable channel produces. Publish the distinction so
          # the auto-close step can require a run that actually checked
          # everything, and so the run itself can fail when it did not.
          channels_verified = not unresolved
          print(f"unknown_channels={','.join(unresolved) if unresolved else '-'}")
          print(f"channels_verified={'true' if channels_verified else 'false'}")
          PY

      - name: Open or update drift issue (idempotent)
        if: steps.cmp.outputs.drift == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PJ: ${{ steps.cmp.outputs.pj_version }}
          PYPI: ${{ steps.cmp.outputs.pypi_version }}
          COPR: ${{ steps.cmp.outputs.copr_version }}
          COPR_DRIFT: ${{ steps.cmp.outputs.copr_drift }}
          NPM: ${{ steps.cmp.outputs.npm_version }}
          BREW: ${{ steps.cmp.outputs.brew_version }}
          AGE: ${{ steps.cmp.outputs.pj_age_hours }}
          RELEASE_EXISTS: ${{ steps.cmp.outputs.release_exists }}
          ASSET_COUNT: ${{ steps.cmp.outputs.asset_count }}
          MISSING_ASSETS: ${{ steps.cmp.outputs.missing_assets }}
          MISSING_SBOMS: ${{ steps.cmp.outputs.missing_sboms }}
          ABSENT_SBOMS: ${{ steps.cmp.outputs.absent_sboms }}
          BEHIND: ${{ steps.cmp.outputs.behind }}
          REPO: ${{ github.repository }}
        run: |
          # The title names the channels that are behind rather than every
          # channel's version: the set grew past what a title can carry, and
          # the channel that needs attention is the useful part.
          TITLE="release drift: pyproject=\`${PJ}\` behind=\`${BEHIND}\`"
          if [ "${MISSING_ASSETS}" = "true" ]; then
            CAUSE="GitHub Release missing dist assets."
          elif [ "${COPR_DRIFT}" = "true" ]; then
            CAUSE="The RPM channel is behind: re-run the Copr publish with \`gh workflow run publish.yml --ref main -f tag=v${PJ} -f copr_only=true\`."
          elif [ "${MISSING_SBOMS}" = "true" ]; then
            CAUSE="GitHub Release missing SBOM assets (\`${ABSENT_SBOMS}\`); \`sbom.yml\` did not attach them for this release."
          else
            CAUSE="Likely cause: a CI run was cancelled/timed_out/action_required so \`auto-release.yml\` silently skipped the publish (see #1273), or the publish job for the named channel failed."
          fi
          # shellcheck disable=SC2016
          BODY=$(printf 'Detected by `.github/workflows/reconcile-release.yml`.\n\n- pyproject.toml on main: **%s**\n- latest on PyPI: **%s**\n- latest on Copr: **%s**\n- latest on npm (`bernstein-orchestrator`): **%s**\n- Homebrew tap formula: **%s**\n- age of pyproject bump: %sh\n- GitHub Release exists: **%s**\n- GitHub Release asset count: **%s**\n- SBOM assets absent: **%s**\n- channels behind: **%s**\n\n%s\n\nRun `gh workflow run reconcile-release.yml` after fixing to clear.\n' \
            "${PJ}" "${PYPI}" "${COPR}" "${NPM}" "${BREW}" "${AGE}" "${RELEASE_EXISTS}" "${ASSET_COUNT}" "${ABSENT_SBOMS}" "${BEHIND}" "${CAUSE}")

          # Idempotency: search for an open issue whose title matches the exact
          # pyproject version and channel set. Re-runs the same day just comment.
          EXISTING=$(gh issue list --repo "${REPO}" --state open \
            --search "in:title release drift pyproject=${PJ}" \
            --json number,title \
            --jq ".[] | select(.title == \"${TITLE}\") | .number" \
            | head -1)

          if [ -n "${EXISTING}" ]; then
            echo "Existing issue #${EXISTING} already tracks this drift - skipping comment to avoid spam."
          else
            gh issue create --repo "${REPO}" \
              --title "${TITLE}" \
              --body "${BODY}" \
              --label "ci,release-drift" || \
            gh issue create --repo "${REPO}" \
              --title "${TITLE}" \
              --body "${BODY}"
          fi

      - name: Auto-close stale drift issues (no drift today)
        # When the channels catch up, the old `release drift: …` issue stays
        # OPEN forever because the previous "open or update" step only fires
        # on the drift==true branch. Close any open release-drift issue here
        # so the inbox self-clears on the next successful publish.
        #
        # `drift != 'true'` on its own is not that evidence. A channel whose
        # probe failed reads as "unknown", which is excluded from the drift
        # verdict and therefore also produces `drift=false` -- so an npm or
        # Copr outage would close the very ticket tracking a dropped npm or
        # Copr publish, over a comment claiming every channel is level.
        # Closing requires a run that read every channel.
        if: steps.cmp.outputs.drift != 'true' && steps.cmp.outputs.channels_verified == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PYPI_VERSION: ${{ steps.cmp.outputs.pypi_version }}
          COPR_VERSION: ${{ steps.cmp.outputs.copr_version }}
          NPM_VERSION: ${{ steps.cmp.outputs.npm_version }}
          BREW_VERSION: ${{ steps.cmp.outputs.brew_version }}
        run: |
          set -euo pipefail
          OPEN=$(gh issue list \
            --repo "${REPO}" \
            --label "release-drift" \
            --state open \
            --json number \
            --jq '.[].number')
          if [ -z "$OPEN" ]; then
            echo "::notice::No open release-drift issues to close."
            exit 0
          fi
          CLEARED="PyPI \`${PYPI_VERSION}\`, Copr \`${COPR_VERSION}\`, npm \`${NPM_VERSION}\`, Homebrew \`${BREW_VERSION}\`"
          for NUM in $OPEN; do
            echo "Closing release-drift issue #${NUM} (${CLEARED})."
            gh issue close "$NUM" \
              --repo "${REPO}" \
              --comment "Every channel is level: ${CLEARED}; drift cleared on $(date -u +%Y-%m-%dT%H:%MZ)." \
              --reason completed || true
          done

      - name: No drift
        # Only a run that read every channel may report the release as level.
        if: steps.cmp.outputs.drift != 'true' && steps.cmp.outputs.channels_verified == 'true'
        env:
          PJ_VERSION: ${{ steps.cmp.outputs.pj_version }}
          PYPI_VERSION: ${{ steps.cmp.outputs.pypi_version }}
          COPR_VERSION: ${{ steps.cmp.outputs.copr_version }}
          NPM_VERSION: ${{ steps.cmp.outputs.npm_version }}
          BREW_VERSION: ${{ steps.cmp.outputs.brew_version }}
          ASSET_COUNT: ${{ steps.cmp.outputs.asset_count }}
          MISSING_ASSETS: ${{ steps.cmp.outputs.missing_assets }}
          MISSING_SBOMS: ${{ steps.cmp.outputs.missing_sboms }}
        run: |
          echo "::notice::No release drift detected (pyproject=${PJ_VERSION}, pypi=${PYPI_VERSION}, copr=${COPR_VERSION}, npm=${NPM_VERSION}, homebrew=${BREW_VERSION}, assets=${ASSET_COUNT}, missing_assets=${MISSING_ASSETS}, missing_sboms=${MISSING_SBOMS})."

      # This step runs last so an unreadable channel still gets the checked
      # channels compared and any real drift filed before the run goes red.
      - name: Fail on unverified channels
        if: steps.cmp.outputs.channels_verified != 'true'
        env:
          UNKNOWN_CHANNELS: ${{ steps.cmp.outputs.unknown_channels }}
          DRIFT: ${{ steps.cmp.outputs.drift }}
        run: |
          echo "::error::reconciliation could not read: ${UNKNOWN_CHANNELS}. Those channels were not compared, so this run is not evidence that the release is level (drift verdict over the channels it did read: ${DRIFT}). Open release-drift issues were left open."
          exit 1
