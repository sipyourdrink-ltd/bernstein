name: CI Weekly Digest

# Roll the last 7 days of main-branch CI signal into ONE rolling tracking
# issue and close the per-event auto-release-skipped issues that already
# fired. Keeps main-branch failure patterns visible without a fresh issue
# every week piling up in the tracker.
#
# What the digest reports (and does not):
#   * Headline "real failures" counts only conclusion failure/timed_out.
#     Cancelled runs are concurrency-superseded almost every time
#     (cancel-in-progress on rapid pushes, superseded schedule ticks) and
#     are reported separately as informational -- they never inflate the
#     failure count.
#   * Failures are split by trigger (schedule vs push) so a chronically red
#     nightly is distinguishable from a one-off push failure.
#   * The aggregation lives in scripts/ci_weekly_digest.py (unit-tested,
#     deterministic) so the numbers are trustworthy and re-runs produce a
#     byte-identical body.
#
# Rolling, not proliferating: publishing this week's digest auto-closes the
# prior weeks' digest issues (bot-authored, title-matched only), so exactly
# one digest issue stays open. A threshold alert fires only when the window
# contains a real failure.
#
# Idempotent: if a digest issue for the current ISO week already exists, the
# workflow edits it in place rather than opening a duplicate.

on:
  schedule:
    # Sunday 12:00 UTC -- after weekend rollover, ahead of Monday triage.
    - cron: "0 12 * * 0"
  workflow_dispatch:
    inputs:
      lookback_days:
        description: "Days of history to aggregate (default 7)"
        required: false
        default: "7"

concurrency:
  group: ci-weekly-digest
  cancel-in-progress: false

permissions: {}

jobs:
  digest:
    name: Build and publish weekly digest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - name: Harden runner (audit mode)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout (for the aggregation script)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Build and publish weekly digest
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          LOOKBACK_DAYS: ${{ github.event.inputs.lookback_days || '7' }}
        run: |
          set -euo pipefail

          # ISO week label (e.g. 2026-W28) makes the digest idempotent per
          # calendar week regardless of which day the schedule fires.
          WEEK_LABEL=$(date -u +'%G-W%V')
          SINCE=$(date -u -d "${LOOKBACK_DAYS} days ago" +'%Y-%m-%dT%H:%M:%SZ' 2>/dev/null \
            || date -u -v-"${LOOKBACK_DAYS}"d +'%Y-%m-%dT%H:%M:%SZ')
          SINCE_DATE="${SINCE%T*}"
          TITLE="CI weekly digest ${WEEK_LABEL}"
          export TITLE

          echo "Building digest for ${WEEK_LABEL} (since ${SINCE})"

          # ----- collect: open + recently-closed auto-release-skipped issues.
          # Both states, so the digest reflects the week even when per-event
          # issues self-closed during cleanup.
          SKIPPED=$(gh issue list --repo "${REPO}" --state all \
            --search "in:title auto-release skipped updated:>=${SINCE_DATE}" \
            --json number --jq '[.[].number] | join(" ")' \
            || true)

          # ----- collect: main-branch runs in the window. Server-side
          # `created` filter + --paginate means we see EVERY run in the
          # window, not just the most recent 100 (the previous single-page
          # query silently dropped failures on busy weeks).
          RUNS_FILE="$(mktemp)"
          gh api --paginate -X GET "repos/${REPO}/actions/runs" \
            -f branch=main \
            -f "created=>=${SINCE_DATE}" \
            -f per_page=100 \
            --jq '.workflow_runs[] | {id, conclusion, event, name, head_sha, html_url}' \
            > "${RUNS_FILE}" || true

          # ----- classify + render (unit-tested, deterministic aggregation)
          BODY_FILE="$(mktemp)"
          ALERT_FILE="$(mktemp)"
          SUMMARY_FILE="$(mktemp)"
          python3 scripts/ci_weekly_digest.py \
            --runs-file "${RUNS_FILE}" \
            --skipped "${SKIPPED}" \
            --week-label "${WEEK_LABEL}" \
            --since "${SINCE}" \
            --lookback-days "${LOOKBACK_DAYS}" \
            --body-file "${BODY_FILE}" \
            --alert-file "${ALERT_FILE}" \
            > "${SUMMARY_FILE}"

          HAS_SIGNAL=$(jq -r '.has_signal' "${SUMMARY_FILE}")
          REAL_FAILURES=$(jq -r '.real_failure_count' "${SUMMARY_FILE}")
          echo "Summary: $(cat "${SUMMARY_FILE}")"

          # ----- idempotent upsert of the digest issue for this week
          EXISTING=$(gh issue list --repo "${REPO}" --state open \
            --search "in:title \"${TITLE}\"" \
            --json number,title \
            --jq ".[] | select(.title == \"${TITLE}\") | .number" \
            | head -1)

          if [ -n "${EXISTING}" ]; then
            echo "Updating existing digest issue #${EXISTING}"
            gh issue edit "${EXISTING}" --repo "${REPO}" --body-file "${BODY_FILE}"
            DIGEST_NUMBER="${EXISTING}"
          else
            echo "Creating new digest issue"
            # `ci` is the only guaranteed label; fall back to no label so a
            # missing label never blocks publishing.
            DIGEST_URL=$(gh issue create --repo "${REPO}" \
              --title "${TITLE}" \
              --body-file "${BODY_FILE}" \
              --label "ci" 2>/dev/null \
              || gh issue create --repo "${REPO}" \
                --title "${TITLE}" \
                --body-file "${BODY_FILE}")
            DIGEST_NUMBER=$(basename "${DIGEST_URL}")
          fi

          # ----- roll forward: close prior weeks' digest issues so exactly
          # one digest stays open. Bot-authored + strict title match only;
          # human issues are never touched.
          mapfile -t OLD_DIGESTS < <(
            gh issue list --repo "${REPO}" --state open \
              --search "in:title \"CI weekly digest\"" \
              --json number,title,author \
              --jq '.[]
                    | select(.author.is_bot == true)
                    | select(.title | startswith("CI weekly digest "))
                    | select(.title != env.TITLE)
                    | .number' \
              || true
          )
          for n in "${OLD_DIGESTS[@]:-}"; do
            [ -z "${n}" ] && continue
            [ "${n}" = "${DIGEST_NUMBER}" ] && continue
            gh issue close "${n}" --repo "${REPO}" \
              --comment "Superseded by the current weekly digest #${DIGEST_NUMBER}. Closing the prior week's digest to keep one rolling tracking issue; reopen if a specific week still needs investigation." \
              || echo "::warning::failed to close old digest #${n}"
          done

          # ----- close per-event auto-release-skipped issues (open ones only;
          # closed ones are already rolled up) with a cross-link.
          mapfile -t OPEN_SKIPPED < <(
            gh issue list --repo "${REPO}" --state open \
              --search "in:title auto-release skipped" \
              --json number \
              --jq '.[].number' \
              || true
          )
          for n in "${OPEN_SKIPPED[@]:-}"; do
            [ -z "${n}" ] && continue
            if [ "${n}" = "${DIGEST_NUMBER}" ]; then
              continue
            fi
            gh issue close "${n}" --repo "${REPO}" \
              --comment "Rolled up into weekly digest #${DIGEST_NUMBER}. Reopen if root-cause investigation needs a separate thread." \
              || echo "::warning::failed to close issue #${n}"
          done

          # ----- run summary + hand off signal state to the alert step
          {
            echo "### CI weekly digest ${WEEK_LABEL}"
            echo ""
            echo "- Real failures on main: **${REAL_FAILURES}**"
            echo "- Digest issue: #${DIGEST_NUMBER}"
            echo "- Closed ${#OLD_DIGESTS[@]} prior digest(s), ${#OPEN_SKIPPED[@]} per-event issue(s)"
          } >> "${GITHUB_STEP_SUMMARY}"

          {
            echo "HAS_SIGNAL=${HAS_SIGNAL}"
            echo "REAL_FAILURES=${REAL_FAILURES}"
            echo "DIGEST_NUMBER=${DIGEST_NUMBER}"
            echo "ALERT_FILE=${ALERT_FILE}"
          } >> "${GITHUB_ENV}"

          echo "Digest #${DIGEST_NUMBER} published (real failures: ${REAL_FAILURES})."

      - name: Threshold alert (Telegram)
        if: ${{ env.HAS_SIGNAL == 'true' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "${TELEGRAM_BOT_TOKEN}" ] || [ -z "${TELEGRAM_CHAT_ID}" ]; then
            echo "Telegram not configured; skipping."
            exit 0
          fi
          TEXT=$(cat "${ALERT_FILE}" 2>/dev/null \
            || echo "CI weekly digest: ${REAL_FAILURES} real failure(s) on main")
          TEXT="${TEXT}
          https://github.com/${REPO}/issues/${DIGEST_NUMBER}"
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${TEXT}" \
            || echo "Telegram notification failed"
