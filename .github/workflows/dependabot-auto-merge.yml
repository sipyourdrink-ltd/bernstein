name: Dependabot Auto-merge

on:
  pull_request:
    # The default three, plus ready_for_review: a Draft is never armed
    # (below), so the event that ends the draft has to reach the gate.
    types: [opened, reopened, synchronize, ready_for_review]

concurrency:
  group: dependabot-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Default-deny at workflow scope; the auto-merge job re-asserts the writes
# it actually needs (Scorecard token-permissions).
permissions:
  contents: read

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    # Spoof-resistant check: github.actor can be impersonated by a setting
    # the User-Agent on the API call. Validate both the bot type and the
    # immutable Dependabot user id (49699333). See zizmor `bot-conditions`.
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.user.id == 49699333 &&
      github.event.pull_request.user.type == 'Bot'
    steps:
      - name: Harden runner (audit mode)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        continue-on-error: true
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Auto-merge patch and minor updates
        if: >
          steps.metadata.outcome == 'success' &&
          (steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.metadata.outputs.update-type == 'version-update:semver-minor')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          # The event's own Draft boolean, bound directly so the shell sees
          # exactly "true" or "false" and nothing a label or title could spoof.
          PR_DRAFT: ${{ github.event.pull_request.draft }}
        # A Draft is deliberate: enabling auto-merge on one is refused by the
        # API anyway (#6758), so finish without calling gh and let the
        # ready_for_review event bring the PR back here. Anything other than
        # a literal true/false means the event did not say, and an update is
        # not armed on a guess.
        #
        # No merge-method flag: main is behind a merge queue, so --auto
        # enqueues and the queue applies its own configured method. An
        # explicit --merge asks for a method the ruleset does not allow.
        run: |
          case "$PR_DRAFT" in
            true)
              echo "Draft pull request: auto-merge is not armed until it is marked ready for review."
              exit 0
              ;;
            false)
              ;;
            *)
              echo "::error::pull_request.draft is '${PR_DRAFT:-<unset>}', not true/false; refusing to arm auto-merge."
              exit 1
              ;;
          esac
          gh pr merge --auto "$PR_URL"
