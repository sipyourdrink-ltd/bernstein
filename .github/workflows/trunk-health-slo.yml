name: Trunk Health SLO

# Compute the last-24h main-red rate (failed CI runs / total CI runs on
# main) and toggle a marker issue labeled `trunk-unstable` accordingly. A
# companion gate step (the trunk andon gate in `pr-policy.yml`) keys off
# that open issue to hold merges on every PR until the trunk recovers,
# unless the PR carries the `hotfix-cleared` label. The flag is an issue
# rather than an Actions variable because GITHUB_TOKEN can write issues
# but not variables, so the mechanism needs no separately provisioned PAT.
#
# The toggle exists so a red trunk stops new merges from piling on top
# of an already-broken main: while the red rate is over threshold the
# gate holds PRs, and only the fix that clears the trunk is let through
# (via the `hotfix-cleared` label). This keeps regressions from
# compounding before main is green again.
#
# Threshold defaults to 5%. Override per-run via workflow_dispatch.

on:
  schedule:
    # Every six hours. The measured red rate moves on a merge cadence of
    # roughly 2/hour, so a 2h sample added little over a 6h one, and the
    # lane has 1 failure in 574 runs. Manual workflow_dispatch is still
    # available for an immediate refresh after recovery, which is the
    # supported path for clearing TRUNK_UNSTABLE without waiting for the
    # next tick.
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      threshold_pct:
        description: "Red-rate threshold (default 5)"
        required: false
        default: "5"
      lookback_hours:
        description: "Lookback window in hours (default 24)"
        required: false
        default: "24"

concurrency:
  group: trunk-health-slo
  cancel-in-progress: true

permissions: {}

jobs:
  compute:
    name: Compute trunk red-rate and toggle the andon marker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      # The andon flag is a marker issue (opened on red, closed on green).
      issues: write
    steps:
      - name: Harden runner (audit mode)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Compute red-rate
        id: compute
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          THRESHOLD_PCT: ${{ github.event.inputs.threshold_pct || '5' }}
          LOOKBACK_HOURS: ${{ github.event.inputs.lookback_hours || '24' }}
        run: |
          set -euo pipefail

          SINCE=$(date -u -d "${LOOKBACK_HOURS} hours ago" +'%Y-%m-%dT%H:%M:%SZ' 2>/dev/null \
            || date -u -v-"${LOOKBACK_HOURS}"H +'%Y-%m-%dT%H:%M:%SZ')
          export SINCE

          echo "Computing red-rate on main since ${SINCE}"

          # Pull last 100 CI workflow runs on main; filter to the
          # primary "CI" workflow only to avoid scoring scheduled
          # housekeeping runs as outages.
          ALL_JSON=$(gh api -X GET "repos/${REPO}/actions/runs" \
            -f branch=main \
            -f per_page=100 \
            --jq '[
              .workflow_runs[]
              | select(.name == "CI")
              | select(.created_at >= env.SINCE)
              | {conclusion, sha: .head_sha, url: .html_url}
            ]')

          TOTAL=$(printf '%s' "${ALL_JSON}" | jq 'length')
          if [ "${TOTAL}" = "0" ]; then
            echo "No CI runs on main in window. Treating as healthy."
            UNSTABLE=false
            RED=0
            RED_PCT=0
          else
            RED=$(printf '%s' "${ALL_JSON}" | jq '[.[] | select(.conclusion == "failure" or .conclusion == "timed_out")] | length')
            # Integer percentage: enough resolution for the threshold.
            RED_PCT=$(( (RED * 100) / TOTAL ))
            if [ "${RED_PCT}" -ge "${THRESHOLD_PCT}" ]; then
              UNSTABLE=true
            else
              UNSTABLE=false
            fi
          fi

          echo "TOTAL=${TOTAL} RED=${RED} RED_PCT=${RED_PCT}% THRESHOLD=${THRESHOLD_PCT}% UNSTABLE=${UNSTABLE}"
          {
            echo "unstable=${UNSTABLE}"
            echo "red_pct=${RED_PCT}"
            echo "red=${RED}"
            echo "total=${TOTAL}"
          } >> "${GITHUB_OUTPUT}"

      - name: Toggle the trunk-unstable marker issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          UNSTABLE: ${{ steps.compute.outputs.unstable }}
          RED_PCT: ${{ steps.compute.outputs.red_pct }}
          RED: ${{ steps.compute.outputs.red }}
          TOTAL: ${{ steps.compute.outputs.total }}
        run: |
          set -euo pipefail

          # The flag is an open issue labeled `trunk-unstable`, not a repo
          # variable. GITHUB_TOKEN cannot write Actions variables under any
          # `permissions:` grant, so the variable design silently depended
          # on a PAT that was never provisioned and the gate spent its life
          # inert. An issue is writable with the job-scoped token, visible
          # to operators without opening a run, and any failure to write it
          # fails this job loudly instead of being swallowed.
          gh label create trunk-unstable \
            --repo "${REPO}" \
            --description "Open while the main-branch red-rate is over the SLO threshold; closed automatically on recovery" \
            --color B60205 --force

          OPEN_MARKERS=$(gh api "repos/${REPO}/issues?labels=trunk-unstable&state=open&per_page=100" \
            --jq '[.[] | select(.pull_request | not) | .number] | join(" ")')

          if [ "${UNSTABLE}" = "true" ]; then
            if [ -z "${OPEN_MARKERS}" ]; then
              gh api -X POST "repos/${REPO}/issues" \
                -f title="Trunk unstable: ${RED_PCT}% of main CI runs red over the SLO window" \
                -f body="$(printf '%s\n' \
                  "The scheduled trunk-health check measured ${RED}/${TOTAL} failed CI runs on main (${RED_PCT}%), over the configured threshold." \
                  "" \
                  "While this issue is open, the andon gate in pr-policy holds merges on every PR except those labeled \`hotfix-cleared\`, so regressions stop compounding on an already-red main." \
                  "" \
                  "This issue closes automatically on the next scheduled check once the red-rate is back under threshold; run the Trunk Health SLO workflow manually for an immediate re-check after landing the fix.")" \
                -f "labels[]=trunk-unstable" >/dev/null
              echo "Opened the trunk-unstable marker issue."
            else
              echo "Marker issue already open (#${OPEN_MARKERS}); leaving it in place."
            fi
          elif [ -n "${OPEN_MARKERS}" ]; then
            for issue_number in ${OPEN_MARKERS}; do
              gh api -X POST "repos/${REPO}/issues/${issue_number}/comments" \
                -f body="Red-rate is back under threshold (${RED_PCT}% over the last window). Closing; merges resume." >/dev/null
              gh api -X PATCH "repos/${REPO}/issues/${issue_number}" -f state=closed >/dev/null
            done
            echo "Closed marker issue(s): ${OPEN_MARKERS}"
          else
            echo "Trunk healthy; no marker open."
          fi

          # Record a short status note for operator visibility. Step
          # summary survives in the run UI without spamming issues.
          {
            echo "## Trunk health SLO"
            echo ""
            echo "| metric | value |"
            echo "|---|---|"
            echo "| CI runs on main (window) | ${TOTAL} |"
            echo "| failed runs | ${RED} |"
            echo "| red-rate | ${RED_PCT}% |"
            echo "| trunk-unstable marker | $([ "${UNSTABLE}" = "true" ] && echo open || echo closed) |"
          } >> "${GITHUB_STEP_SUMMARY}"
