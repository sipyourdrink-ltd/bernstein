name: Observability snapshot

on:
  workflow_dispatch: {}

concurrency:
  group: docs-observability-snapshot
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  snapshot:
    name: Capture snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      security-events: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920  # v2.20.0
        with:
          egress-policy: audit
          disable-sudo: true

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up uv
        uses: ./.github/actions/bootstrap
        with:
          python-version: '3.13'

      - name: Install bernstein
        run: |
          uv sync --group dev

      - name: Capture observe snapshot
        id: capture
        continue-on-error: true  # `doctor observe` may return 1 on a backend WARN; snapshot still valid.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DTRACK_URL: ${{ secrets.DT_API_URL }}
          DTRACK_TOKEN: ${{ secrets.DT_API_KEY }}
          DTRACK_PROJECT: ${{ vars.DTRACK_PROJECT }}
        run: |
          set -euo pipefail
          mkdir -p docs/_internal/observability/snapshots
          DATE=$(date -u +%Y-%m-%d)
          uv run bernstein doctor observe --json --no-persist \
            > "docs/_internal/observability/snapshots/${DATE}.json"
          echo "snapshot=docs/_internal/observability/snapshots/${DATE}.json" >> "$GITHUB_OUTPUT"

      - name: Render 30-day trends
        run: |
          uv run python scripts/observability/render_trends.py \
            --snapshots-dir docs/_internal/observability/snapshots \
            --out docs/observability/trends.md \
            --days 30

      - name: Detect metric regressions and alert
        # Non-blocking: the snapshot PR still opens on a regression. The gate
        # diffs the new snapshot against the previous one and pages Telegram
        # only on a fail-severity regression (new critical/high vuln, a metric that
        # crossed its fail threshold). Warn-level drift (coverage slip, a
        # backend that lost its credentials) is recorded in the run summary.
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -uo pipefail
          mkdir -p .ci/observability
          uv run python scripts/observability/gate.py \
            --snapshots docs/_internal/observability/snapshots \
            --out .ci/observability/regressions.json \
            --summary-out "${GITHUB_STEP_SUMMARY:-/dev/null}" || true

          if [ ! -s .ci/observability/regressions.json ]; then
            echo "No regressions recorded."
            exit 0
          fi
          FAILS=$(jq '[.[] | select(.severity == "fail")] | length' .ci/observability/regressions.json)
          if [ "${FAILS:-0}" -eq 0 ]; then
            echo "No fail-severity regression; not paging."
            exit 0
          fi
          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ] || [ -z "${TELEGRAM_CHAT_ID:-}" ]; then
            echo "Telegram not configured; skipping push."
            exit 0
          fi
          DETAIL=$(jq -r '[.[] | select(.severity == "fail") | "\(.backend) \(.metric): \(.reason)"] | join("\n")' \
            .ci/observability/regressions.json)
          RUN_URL="https://github.com/${GITHUB_REPOSITORY:-}/actions/runs/${GITHUB_RUN_ID:-}"
          TEXT="observability regression (${FAILS} fail-severity)
          ${DETAIL}
          ${RUN_URL}"
          BODY=$(jq -n --arg chat "${TELEGRAM_CHAT_ID}" --arg text "${TEXT}" '{chat_id: $chat, text: $text}')
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "${BODY}" \
            || echo "Telegram notification failed"

      - name: Open PR with snapshot + trends
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1  # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: chore/observability-snapshot
          delete-branch: true
          add-paths: |
            docs/_internal/observability/snapshots/
            docs/observability/trends.md
          commit-message: |
            chore(observability): snapshot + trends refresh
          title: 'chore(observability): snapshot + trends refresh'
          body: |
            Automated observability snapshot generated by
            `docs-observability-snapshot.yml`. Includes today's JSON
            snapshot under `docs/_internal/observability/snapshots/` and a
            re-rendered `docs/observability/trends.md` covering the
            last 30 days.
          labels: |
            chore
            observability
