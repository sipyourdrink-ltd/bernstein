name: PR labels

# Consolidated labeling lane: one runner job applies the path-based
# area labels (actions/labeler) and the size label (pr-size-labeler).
# Replaces the separate labeler.yml and pr-size.yml workflows, cutting
# one runner slot per PR event on the shared pool.
#
# Safety note (zizmor dangerous-triggers): this workflow uses
# `pull_request_target` intentionally so PRs opened from forks can still be
# labelled by maintainers (the default `pull_request` event runs with a
# read-only token on fork PRs and cannot write labels). The job:
#   - Does NOT check out PR head code (no `actions/checkout` with `ref:`).
#   - Only consumes path-based label rules from the trusted base ref via
#     `actions/labeler`, which fetches the config from `github.sha` (base),
#     and diff metadata via the API (pr-size-labeler).
#   - Has narrowly scoped write permissions and no secrets beyond
#     `GITHUB_TOKEN`.
# Attacker-controlled PR content never reaches a `run:` block here.
# After labeling, a separate API-only job reruns the existing current-head
# quorum checks: GITHUB_TOKEN label events do not trigger new workflows.
# It has no checkout, shell, PAT, or ability to publish a quorum verdict.
on:  # zizmor: ignore[dangerous-triggers]
  pull_request_target:

concurrency:
  group: pr-labels-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Default-deny at workflow scope; the label job re-asserts the narrow
# write scopes it actually needs (Scorecard token-permissions).
permissions:
  contents: read

jobs:
  label:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Harden runner (audit mode)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - name: Apply area labels
        uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7
        with:
          repo-token: "${{ secrets.GITHUB_TOKEN }}"
          sync-labels: true
      - name: Apply size label
        uses: codelytv/pr-size-labeler@19c335e7695ba922de938806dd129f0a9b992644 # v1
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          xs_label: "size/xs"
          xs_max_size: "10"
          s_label: "size/s"
          s_max_size: "100"
          m_label: "size/m"
          m_max_size: "500"
          l_label: "size/l"
          l_max_size: "1000"
          xl_label: "size/xl"
          fail_if_xl: "false"
          message_if_xl: >-
            This PR exceeds the recommended size of 1000 lines.
            Consider splitting it into smaller, reviewable chunks.
          files_to_ignore: |
            package-lock.json
            yarn.lock
            pnpm-lock.yaml
            *.lock

  quorum-after-labels:
    needs: label
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      checks: read
      pull-requests: read
    steps:
      - name: Harden runner (audit mode)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - name: Re-run quorum after labels
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const repo = context.repo;
            const eventPR = context.payload.pull_request;
            const head = eventPR.head.sha;
            let waitsLeft = 60;
            const pause = async () => {
              if (waitsLeft-- <= 0) throw new Error('Quorum reconciliation timed out');
              await new Promise(resolve => setTimeout(resolve, 4000));
            };
            const isCurrentPR = async () => {
              const {data: pr} = await github.rest.pulls.get({
                ...repo, pull_number: eventPR.number,
              });
              if (pr.state !== 'open' || pr.head.sha !== head) {
                core.info('PR closed or head changed; the newer event owns reconciliation.');
                return false;
              }
              return true;
            };
            // Wait for earlier evaluations so an old-label result cannot
            // finish after the recomputed result and overwrite it.
            for (let attempt = 0; attempt < 60; attempt++) {
              if (!await isCurrentPR()) return;
              const checks = (await github.paginate(github.rest.checks.listForRef, {
                ...repo, ref: head, check_name: 'quorum', filter: 'all', per_page: 100,
              })).filter(check => check.app?.slug === 'github-actions');
              if (checks.length && checks.every(check => check.status === 'completed')) {
                const runs = [...new Set(checks.map(check => {
                  const url = new URL(check.html_url);
                  const prefix = `/${repo.owner}/${repo.repo}/actions/runs/`;
                  const suffix = url.pathname.slice(prefix.length);
                  if (url.origin !== process.env.GITHUB_SERVER_URL ||
                      !url.pathname.startsWith(prefix) || !/^\d+\/job\/\d+$/.test(suffix)) {
                    throw new Error('Unexpected quorum check run URL');
                  }
                  return Number(suffix.split('/')[0]);
                }))];
                // Fail before any POST if reconciliation exceeds the shared
                // sweep budget; never claim a partial repair as success.
                if (runs.length > 12) throw new Error('Too many quorum runs; explicit recovery required');
                let reconciled = false;
                let unidentified = false;
                for (const run_id of runs) {
                  const {data: previous} = await github.rest.actions.getWorkflowRun({...repo, run_id});
                  const associations = previous.pull_requests;
                  if (!Array.isArray(associations) || associations.length !== 1 ||
                      !Number.isInteger(associations[0]?.number)) {
                    unidentified = true;
                    continue;
                  }
                  const [association] = associations;
                  if (association.number !== eventPR.number) continue;
                  if (previous.path !== '.github/workflows/quorum.yml' || previous.head_sha !== head ||
                      association.head?.sha !== head || previous.status !== 'completed' ||
                      !Number.isInteger(previous.run_attempt)) {
                    throw new Error('Quorum run changed before reconciliation');
                  }
                  if (!await isCurrentPR()) return;
                  core.info(`Re-running quorum run ${run_id} for #${eventPR.number} at ${head}`);
                  await github.rest.actions.reRunWorkflow({...repo, run_id});
                  // Same-PR quorum runs share cancel-in-progress concurrency.
                  // Wait for this new attempt before starting another run.
                  // The API can briefly return the completed old attempt.
                  while (true) {
                    const {data: current} = await github.rest.actions.getWorkflowRun({...repo, run_id});
                    if (current.run_attempt > previous.run_attempt && current.status === 'completed') {
                      if (!['success', 'failure'].includes(current.conclusion)) {
                        throw new Error('Quorum rerun did not produce an evaluation');
                      }
                      reconciled = true;
                      break;
                    }
                    await pause();
                  }
                }
                if (unidentified) throw new Error('Quorum run has no unique pull request association');
                if (!reconciled) throw new Error('No quorum run belongs to this pull request');
                return;
              }
              await pause();
            }
            throw new Error('Quorum checks did not settle after labeling; no stale verdict accepted');
