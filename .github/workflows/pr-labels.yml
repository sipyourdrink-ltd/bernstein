name: PR labels

# Consolidated labeling lane: one runner job applies the path-based
# area labels (actions/labeler) and the size label (pr-size-labeler).
# Replaces the separate labeler.yml and pr-size.yml workflows, cutting
# one runner slot per PR event on the shared pool.
#
# Safety note (zizmor dangerous-triggers): this workflow uses
# `pull_request_target` intentionally so PRs opened from forks can still be
# labelled by maintainers (the default `pull_request` event runs with a
# read-only token on fork PRs and cannot write labels). The job:
#   - Does NOT check out PR head code (no `actions/checkout` with `ref:`).
#   - Only consumes path-based label rules from the trusted base ref via
#     `actions/labeler`, which fetches the config from `github.sha` (base),
#     and diff metadata via the API (pr-size-labeler).
#   - Has narrowly scoped write permissions and no secrets beyond
#     `GITHUB_TOKEN`.
# Attacker-controlled PR content never reaches a `run:` block here.
on:  # zizmor: ignore[dangerous-triggers]
  pull_request_target:

concurrency:
  group: pr-labels-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Default-deny at workflow scope; the label job re-asserts the narrow
# write scopes it actually needs (Scorecard token-permissions).
permissions:
  contents: read

jobs:
  label:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Harden runner (audit mode)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - name: Apply area labels
        uses: actions/labeler@b8dd2d9be0f68b860e7dae5dae7d772984eacd6d # v6.2.0
        with:
          repo-token: "${{ secrets.GITHUB_TOKEN }}"
          sync-labels: true
      - name: Apply size label
        uses: codelytv/pr-size-labeler@095a41fca88b8764fd9e008ad269bcdb82bb38b9 # v1
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          xs_label: "size/xs"
          xs_max_size: "10"
          s_label: "size/s"
          s_max_size: "100"
          m_label: "size/m"
          m_max_size: "500"
          l_label: "size/l"
          l_max_size: "1000"
          xl_label: "size/xl"
          fail_if_xl: "false"
          message_if_xl: >-
            This PR exceeds the recommended size of 1000 lines.
            Consider splitting it into smaller, reviewable chunks.
          files_to_ignore: |
            package-lock.json
            yarn.lock
            pnpm-lock.yaml
            *.lock
