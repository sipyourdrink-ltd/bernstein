name: "6748 Python 3.12 diagnostic (lineage attempt 2)"

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: diagnostic-6748-python312-${{ github.sha }}
  cancel-in-progress: false

jobs:
  diagnose-original-shard:
    if: github.ref == 'refs/heads/fix/6748-python312-diagnostics'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      TEST_SHARD_COUNT: "8"
      BERNSTEIN_TEST_FILE_TIMEOUT_SECONDS: "600"
    steps:
      - name: Harden runner (audit mode)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: f1e3552c19c66e42e2bf4b7481a9b91bffb1b23d
          persist-credentials: false
      - name: Establish origin/HEAD as in original job
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git fetch --no-tags --depth=1 origin "+refs/heads/${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}"
          git remote set-head origin -a
      - uses: ./.github/actions/bootstrap
        with:
          python-version: "3.12"
      - name: Run original six-worker shard with target-only diagnostics
        env:
          EVENT_NAME: "workflow_dispatch"
          PLANNED: ""
          PYTHON_VERSION: "3.12"
          SHARD: "3"
          SHARD_COUNT: "8"
        shell: bash
        run: |
          diagnostic_path="${RUNNER_TEMP}/bernstein-6748-python312-diagnostic.py"
          cat > "$diagnostic_path" <<'PY'
          from __future__ import annotations
          
          import hashlib
          import json
          import os
          from pathlib import Path
          import platform
          import re
          import subprocess
          import sys
          import uuid
          
          SOURCE_SHA = "f1e3552c19c66e42e2bf4b7481a9b91bffb1b23d"
          TARGET = "tests/unit/test_orchestrator.py"
          TARGET_BLOB = "5ce7b6843dda5252e40cf749a21e894d2e3b3e09"
          ROOT = Path.cwd().resolve()
          ORIGINAL_SAFE_ENV = {'TEST_SHARD_COUNT': '8', 'BERNSTEIN_TEST_FILE_TIMEOUT_SECONDS': '600', 'EVENT_NAME': 'workflow_dispatch', 'PLANNED': '', 'PYTHON_VERSION': '3.12', 'SHARD': '3', 'SHARD_COUNT': '8'}
          
          
          def memory_snapshot() -> dict[str, object]:
              result: dict[str, object] = {"pid": os.getpid()}
              for relative in ("memory.events", "memory.current", "memory.max"):
                  path = Path("/sys/fs/cgroup") / relative
                  try:
                      text = path.read_text()
                      assert len(text) < 4096
                      result[relative] = text.strip()
                  except OSError:
                      result[relative] = "unavailable"
              try:
                  lines = Path("/proc/self/status").read_text().splitlines()
                  result["own_process_memory"] = [line for line in lines if line.startswith(("Pid:", "VmRSS:", "VmHWM:"))]
              except OSError:
                  result["own_process_memory"] = "unavailable"
              return result
          
          
          def emit_target_output(label: str, code: int, duration: float, output: str, stderr: str = "") -> str:
              if re.search(r"(?:^|\s)tests/unit/test_orchestrator\.py(?:\s|$)", label):
                  # The untouched native returncode is observed BEFORE runner classification.
                  print(json.dumps({"diagnostic_target": TARGET, "native_returncode": code,
                                    "native_signal": -code if code < 0 else None,
                                    "seconds": duration, "memory_at_target_completion": memory_snapshot()}), flush=True)
                  if code != 0:
                      stdout = output[:-len(stderr)] if stderr else output
                      stop_token = uuid.uuid4().hex
                      print(f"::stop-commands::{stop_token}", flush=True)
                      try:
                          print("BEGIN EXACT TARGET STDOUT", flush=True)
                          print(stdout, end="" if stdout.endswith("\n") else "\n", flush=True)
                          print("END EXACT TARGET STDOUT; BEGIN EXACT TARGET STDERR", flush=True)
                          print(stderr, end="" if stderr.endswith("\n") else "\n", flush=True)
                          print("END EXACT TARGET STDERR", flush=True)
                      finally:
                          print(f"::{stop_token}::", flush=True)
              return ORIGINAL_REPORT(label, code, duration, output, stderr)
          
          
          if __name__ == "__main__":
              assert subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip() == SOURCE_SHA
              assert subprocess.check_output(["git", "status", "--porcelain"], text=True) == ""
              assert subprocess.check_output(["git", "rev-parse", f"HEAD:{TARGET}"], text=True).strip() == TARGET_BLOB
              print(json.dumps({"interpreter_provenance": {"sys_executable": sys.executable,
                    "base_executable": sys._base_executable,
                    "resolved_base_executable": str(Path(sys._base_executable).resolve()),
                    "version": sys.version}}), flush=True)
              assert sys.version_info[:3] == (3, 12, 3), sys.version
              assert Path(sys._base_executable).resolve() == Path("/usr/bin/python3.12").resolve(), sys._base_executable
              assert {key: os.environ.get(key) for key in ORIGINAL_SAFE_ENV} == ORIGINAL_SAFE_ENV
              sys.path.insert(0, str(ROOT))
              from scripts import run_tests as runner
          
              assert Path(runner.__file__).resolve() == ROOT / "scripts/run_tests.py"
              files = runner.discover_test_files(Path(runner.DEFAULT_TEST_DIR))
              durations = runner.load_shard_durations()
              selected = runner.shard_files(files, 3, 8, durations=durations or None)
              assert len(selected) == 362 and Path(TARGET) in selected
              identity = {"source_sha": SOURCE_SHA, "target_blob": TARGET_BLOB, "python": sys.version,
                          "sys_executable": sys.executable, "base_executable": sys._base_executable,
                          "resolved_base_executable": str(Path(sys._base_executable).resolve()),
                          "platform": platform.platform(), "original_command": "uv run python scripts/run_tests.py --parallel 6 --shard 3/8",
                          "workers": 6, "selected_files": len(selected),
                          "selected_manifest_sha256": hashlib.sha256("\n".join(map(str, selected)).encode()).hexdigest(),
                          "safe_test_environment": {key: os.environ.get(key) for key in
                              tuple(ORIGINAL_SAFE_ENV)}}
              print(json.dumps(identity), flush=True)
              before = memory_snapshot()
              print("DIAGNOSTIC_MEMORY_START " + json.dumps(before), flush=True)
              ORIGINAL_REPORT = runner._report_file_result
              runner._report_file_result = emit_target_output
              sys.argv = [str(ROOT / "scripts/run_tests.py"), "--parallel", "6", "--shard", "3/8"]
              try:
                  runner.main()
              finally:
                  after = memory_snapshot()
                  print("DIAGNOSTIC_MEMORY_END " + json.dumps(after), flush=True)
                  # Raw start/end counters are retained; no unsupported OOM inference.
          PY
          uv run python "$diagnostic_path"
