name: quorum rerun

# Re-runs the `quorum` check when its answer can have changed without a push.
#
# Three cases. A review is submitted, edited or dismissed: `pull_request` does
# not fire for that, so the last quorum run still shows the old verdict and an
# approval would otherwise sit unnoticed until the next push. The 72-hour
# objection window on governance files (charter, section 10) closes with the
# clock rather than with an event, so an hourly sweep re-runs those. And a
# pull request can hold a verdict older than its own reviews: the
# `pull_request_review` trigger below landed on 2026-09-12 (#5858), so every
# approval given before then sits in a check run nobody recomputed, and the
# governance pass does not reach those pull requests. #5713 stayed BLOCKED
# that way for two days with its quorum satisfied and a green run already on
# the head.
#
# The third case is still not "re-run everything hourly", which would spend
# runner slots the queue needs. A pull request qualifies only when a review is
# newer than a quorum run that is still red on its head -- the evidence that
# the verdict on record predates the answer it should be giving. Re-running
# advances that run's timestamp whatever it concludes, so each stale verdict
# costs one re-run and the set drains instead of repeating.
#
# `pull_request_review` is a privileged trigger: it runs the workflow from the
# base branch with a writable token, including for pull requests from forks.
# That is safe here because nothing from the pull request is checked out or
# executed - the job only asks the API to re-run an existing workflow run.

on:
  pull_request_review:
    types: [submitted, edited, dismissed]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch: {}

concurrency:
  group: quorum-rerun-${{ github.event.pull_request.number || 'sweep' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  rerun:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      actions: write
    steps:
      - name: Harden runner (audit mode)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Re-run quorum
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          REVIEWED_PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          # How many re-runs one sweep starts. The pool's ceiling is 20
          # concurrent jobs and the merge queue needs most of it, so a backlog
          # drains over a few hours rather than claiming the pool in one pass.
          # Steady state sits far below this: only pull requests reviewed since
          # the last sweep qualify.
          MAX_RERUNS=12
          started=0

          # Look the run up BY COMMIT, never by workflow file.
          #
          # The repository carries two workflow registrations for quorum.yml.
          # `gh run list --workflow quorum.yml` resolves to 354225427, whose
          # only runs are workflow_dispatch; every pull_request and merge_group
          # run of the check carries workflow_id 354268719, and
          # GET /actions/workflows/354268719 is a 404. So the lookup returned
          # nothing for exactly the runs this sweep exists to re-run, and every
          # governance pull request was reported as "already green or never
          # ran" while its check sat red (#5827).
          #
          # `gh run rerun` refuses for the same reason -- it resolves the
          # workflow before posting -- so the rerun goes through the REST
          # endpoint, which works on these runs today.
          #
          # Every non-success instance is re-run, not only the newest. Branch
          # protection folds every check run of a required name into one
          # verdict, so a single leftover red holds the pull request at BLOCKED
          # however many later runs concluded success (#3042, #3154) -- which
          # is why a fresh green run of its own does not clear it.
          #
          # The optional second argument keeps a call to the runs that finished
          # BEFORE the event that can have changed their answer. Without it
          # every red run is re-run, which is what the governance pass wants.
          rerun_for () {  # rerun_for <pr-number> [older-than-iso-8601]
            local pr="$1" before="${2:-}" head run started_at found=0 current=0
            # Checked before the lookups, not only before the POST: an exhausted
            # sweep otherwise spends two API calls per remaining pull request to
            # learn something it cannot act on.
            if [ "$started" -ge "$MAX_RERUNS" ]; then
              echo "#$pr: re-run budget spent this sweep; the next one picks it up"
              return 0
            fi
            head=$(gh pr view "$pr" --repo "$REPO" --json headRefOid --jq .headRefOid)
            # The check run names its own run in html_url; that is the id the
            # rerun endpoint wants, and it is reachable without the workflow.
            while read -r started_at run; do
              [ -z "${run:-}" ] && continue
              # ISO-8601 in UTC sorts lexicographically, so this is the
              # "ran before the review" test without a date parser.
              if [ -n "$before" ] && [[ ! "$started_at" < "$before" ]]; then
                current=1
                continue
              fi
              found=1
              if [ "$started" -ge "$MAX_RERUNS" ]; then
                echo "#$pr: re-run budget spent mid-pull-request; the next sweep finishes it"
                return 0
              fi
              echo "re-running quorum for #$pr (run $run, head ${head:0:9})"
              if gh api -X POST "repos/${REPO}/actions/runs/${run}/rerun" >/dev/null; then
                started=$((started + 1))
              else
                echo "  rerun refused; the next push will re-evaluate"
              fi
            done <<RUNS
          $(gh api "repos/${REPO}/commits/${head}/check-runs?check_name=quorum" \
              --jq '.check_runs[]
                    | select(.conclusion != null and .conclusion != "success")
                    | "\(.started_at) \(.html_url | capture("/actions/runs/(?<id>[0-9]+)").id)"')
          RUNS
            if [ "$found" -eq 0 ] && [ "$current" -eq 1 ]; then
              echo "#$pr: quorum last ran after the newest review; its verdict is current"
            elif [ "$found" -eq 0 ]; then
              echo "#$pr: quorum already green, still running, or never ran; nothing to do"
            fi
          }

          if [ -n "${REVIEWED_PR:-}" ]; then
            rerun_for "$REVIEWED_PR"
            exit 0
          fi

          # Sweep, pass 1: the pull requests whose verdict moves with the clock,
          # i.e. the ones inside the governance objection window. No event marks
          # that window closing, so nothing else recomputes them.
          governance=$(gh pr list --repo "$REPO" --state open --limit 200 \
              --json number,isDraft,files \
              --jq '.[] | select(.isDraft | not)
                        | select([.files[].path] | any(
                            . == "docs/governance/review-charter.md" or . == "GOVERNANCE.md"
                            or . == "MAINTAINERS.md" or . == ".github/CODEOWNERS"
                            or . == ".github/quorum-roster.toml"
                            or . == "scripts/quorum_check.py" or . == "scripts/queue_hygiene.py"))
                        | .number')
          handled=" "
          for pr in $governance; do
            rerun_for "$pr"
            handled="${handled}${pr} "
          done

          # Sweep, pass 2: the pull requests holding a verdict older than their
          # own reviews. One list call carries every review timestamp, and the
          # per-pull-request lookup then re-runs only the quorum runs that
          # predate the newest of them. A pull request with no review cannot
          # have earned a verdict it is not being given, so it is never looked
          # at; a pull request pass 1 already handled is skipped rather than
          # re-run twice.
          gh pr list --repo "$REPO" --state open --limit 200 \
              --json number,isDraft,reviews \
              --jq '.[] | select(.isDraft | not)
                        | select(.reviews | length > 0)
                        | "\(.number) \([.reviews[].submittedAt] | max)"' \
            | while read -r pr last_review; do
                case "$handled" in *" $pr "*) continue ;; esac
                rerun_for "$pr" "$last_review"
              done

      # The sweep also asks for what the check says is missing. Only the base
      # branch is checked out, so this stays safe under the privileged trigger.
      - name: Check out the scripts
        if: github.event_name != 'pull_request_review'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Ask the roster for the reviews still missing
        if: github.event_name != 'pull_request_review'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          QUORUM_REQUEST_REVIEWS: ${{ vars.QUORUM_REQUEST_REVIEWS }}
        run: python3 scripts/quorum_request_reviews.py
