name: CodeQL Security Analysis

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/codeql.yml"
      - ".github/codeql/**"
  # Every pull request into `main` is analysed, with no path filter, so each
  # merged change has a code-scanning result on its own head commit. This
  # restores the trigger dropped in #5795. The analysis stays advisory: branch
  # protection does not require CodeQL. What it adds is that a new finding is
  # reported on the pull request that introduces it instead of on the trunk
  # after the merge. Cost: one analysis per pushed head commit, about 4-6
  # job-minutes; a newer push cancels the older pull-request run (below).
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 4 * * 1"  # Weekly Monday 4 AM UTC

concurrency:
  group: codeql-${{ github.ref }}
  # Trunk runs (push, schedule) are never cancelled: a cancelled CodeQL run
  # leaves code scanning in a "CodeQL exited with errors" configuration-error
  # state and drops that commit's coverage. A pull-request run is superseded by
  # the run for the newer head commit, which is the one that gets merged.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Default-deny at workflow scope; the analyze job re-asserts the narrow
# writes it actually needs (Scorecard token-permissions).
permissions:
  contents: read

jobs:
  analyze:
    if: >-
      !startsWith(github.head_ref, 'fleet/carry-') &&
      !startsWith(github.event.pull_request.head.ref, 'fleet/carry-') &&
      !startsWith(github.ref, 'refs/heads/fleet/carry-')
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [python]
    steps:
      - name: Harden runner (audit mode)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          languages: ${{ matrix.language }}
          queries: +security-extended
          config-file: .github/codeql/codeql-config.yml

      - name: Autobuild
        uses: github/codeql-action/autobuild@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        env:
          # The only way to load an unpublished model pack that lives in this
          # repository. `packs:` in the config file resolves names through the
          # registry, so it cannot see this one; a path there is ignored with a
          # warning rather than an error, which is why the pack was silently
          # absent from every analysis between #4426 and #6024. The action
          # forwards this JSON to the named CodeQL subcommand, so the flags
          # land on `database run-queries`, after the database already exists.
          # `--additional-packs` is the directory searched for packs, so it is
          # the parent of the pack directory, not the pack itself.
          CODEQL_ACTION_EXTRA_OPTIONS: >-
            {"database":{"run-queries":[
            "--additional-packs","${{ github.workspace }}/.github/codeql",
            "--model-packs","bernstein/codeql-sanitizers"]}}
        with:
          category: "/language:${{ matrix.language }}"
