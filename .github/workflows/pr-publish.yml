name: Publish PR observability and autosync

# Safety note (zizmor dangerous-triggers): workflow_run executes this definition
# and github.sha from the default branch after checking head_repository.id ==
# repository.id and validating the bounded artifact in scripts/prepare_pr_publication.py.
# A PR can supply observations or a diff, never the publishing steps or destination.
on:  # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows: ["PR observability summary", "PR policy"]
    types: [completed]

permissions: {}

jobs:
  prepare:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.id == github.event.repository.id &&
      ((github.event.workflow_run.path == '.github/workflows/pr-policy.yml' &&
        github.event.workflow_run.event == 'pull_request') ||
       (github.event.workflow_run.path == '.github/workflows/pr-observability-summary.yml' &&
        (github.event.workflow_run.event == 'pull_request' ||
         github.event.workflow_run.event == 'workflow_dispatch')))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      kind: ${{ steps.prepare.outputs.kind }}
      number: ${{ steps.prepare.outputs.number }}
      ref: ${{ steps.prepare.outputs.ref }}
      sha: ${{ steps.prepare.outputs.sha }}
      data: ${{ steps.prepare.outputs.data }}
    steps:
      - name: Checkout publisher from the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          path: trusted
          persist-credentials: false
      - name: Validate the triggering run, target and bounded artifact
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I trusted/scripts/prepare_pr_publication.py

  comment:
    needs: prepare
    if: needs.prepare.outputs.kind == 'comment'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: pr-observability-comment-${{ needs.prepare.outputs.number }}
      cancel-in-progress: false
    permissions:
      pull-requests: write
    steps:
      - name: Check the target again after waiting for the comment runner
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ needs.prepare.outputs.number }}
          EXPECTED_SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          set -euo pipefail
          if [[ -n "$EXPECTED_SHA" ]]; then
            pr=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$NUMBER")
            jq -e --arg sha "$EXPECTED_SHA" '.state == "open" and .head.sha == $sha and any(.labels[]; .name == "deep-review")' <<< "$pr" > /dev/null || exit 0
          fi
          echo "current=true" >> "$GITHUB_OUTPUT"
      - name: Write the validated report as data
        env:
          REPORT: ${{ needs.prepare.outputs.data }}
        run: |
          test -n "$REPORT"
          printf '%s' "$REPORT" | base64 --decode > "$RUNNER_TEMP/observability.md"
      - name: Post sticky comment
        if: steps.target.outputs.current == 'true'
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          GITHUB_TOKEN: ${{ github.token }}
          number: ${{ needs.prepare.outputs.number }}
          header: bernstein-observability
          path: ${{ runner.temp }}/observability.md

  verify-autosync:
    needs: prepare
    if: needs.prepare.outputs.kind == 'autosync'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout trusted verification tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          path: trusted
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.9'
          enable-cache: false
      - name: Install the default branch's locked tools
        working-directory: trusted
        run: uv sync --locked --no-editable --group dev
      - name: Checkout the exact PR tree as input data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          path: source
          persist-credentials: false
      - name: Independently regenerate and compare the exact diff
        env:
          PR_HEAD_SHA: ${{ needs.prepare.outputs.sha }}
          PATCH: ${{ needs.prepare.outputs.data }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: trusted/.venv/bin/python -I trusted/scripts/verify_autosync.py

  autosync:
    needs: [prepare, verify-autosync]
    if: needs.prepare.outputs.kind == 'autosync'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: automation
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout publisher from the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          path: trusted
          persist-credentials: false
      - name: Commit and push regen to PR head ref
        env:
          BERNSTEIN_AUTOSYNC_TOKEN: ${{ secrets.BERNSTEIN_AUTOSYNC_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.prepare.outputs.number }}
          PR_HEAD_REF: ${{ needs.prepare.outputs.ref }}
          PR_HEAD_SHA: ${{ needs.prepare.outputs.sha }}
          PATCH: ${{ needs.prepare.outputs.data }}
        run: python3 -I trusted/scripts/publish_autosync.py
