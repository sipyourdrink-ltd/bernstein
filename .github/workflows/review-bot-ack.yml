name: Review-bot acknowledgement gate

# Pre-merge gate: ensure every must-address CodeRabbit and Sourcery
# finding on a PR is either fixed in a fixup commit or explicitly
# acknowledged in the PR body. Automated review tools flag legitimate
# correctness and security issues; this gate keeps the merge queue
# honest by blocking merge until those findings are processed.
#
# The check name emitted by this workflow is `review-bot-ack`, and branch
# protection on `main` requires it alongside `CI gate`. It is published
# through the Checks API rather than by naming a job after it - see the
# concurrency comment below for why. `tests/unit/test_required_check_canary_workflow_yaml.py`
# asserts the context stays publishable on a `merge_group` ref; its
# `CI gate` emitter allow-list is a separate invariant this workflow does
# not participate in.

on:
  pull_request:
    types: [opened, synchronize, edited, reopened]
  pull_request_review:
    types: [submitted]
  # The merge queue evaluates required checks on a synthetic merge_group
  # ref that has no pull_request payload. Without a merge_group trigger the
  # `review-bot-ack` context is never published on the queued group, so the
  # queue waits forever for a check that cannot report. The queue-side job
  # below publishes the same context name on this event.
  merge_group: {}

# No job in this workflow is named `review-bot-ack`.
#
# That is the whole fix, and it is deliberate. A job publishes a check-run
# named after itself, and that check-run inherits the job's fate. Branch
# protection folds every check-run of a required name into its verdict and
# a later success does not clear an earlier non-success, so a job named
# after a required context turns two ordinary job states into permanent
# blocks on the commit:
#
#   * cancelled -> a `cancelled` instance holds the PR at BLOCKED for the
#     life of that SHA (#3042, #3154), and
#   * skipped -> GitHub counts `skipped` as passing, so a job gated off by
#     an `if:` can satisfy a gate it never ran.
#
# Keying the concurrency group on the event name did not close this. With
# `cancel-in-progress: false` a group is a one-deep queue: when a run is
# executing and a second is pending, a third arriving in the same group
# cancels the pending one. Both lanes reach three events on one head SHA
# routinely - `synchronize` plus two body edits on the `pull_request` side,
# and two review bots plus a human on the `pull_request_review` side - so
# both lanes produced cancelled instances.
#
# The jobs below publish the context through `scripts/publish_required_check.py`
# instead, which upserts a single terminal check-run per head SHA. Job
# states can no longer write the context, so cancellation is safe again and
# this workflow cancels superseded runs like every other `pull_request`
# workflow. See docs/operations/ci.md :: "Gating vs advisory workflows".
concurrency:
  group: review-bot-ack-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  # Queue-side emitter. The merge queue evaluates required checks on a
  # synthetic merge_group ref with no pull_request payload, so the real gate
  # below cannot run there. This job publishes the `review-bot-ack` context
  # on the queued group, but it is NOT an unconditional pass (#3114): it
  # resolves the pull request the queue entry was built from and requires
  # that a `review-bot-ack` check-run already concluded `success` on that
  # PR's own head commit. The queue context therefore attests "the PR-stage
  # gate really ran and really passed", and it fails closed on anything it
  # cannot resolve: an unparseable queue ref, a missing PR, or a head commit
  # whose gate never reported success.
  merge-group-verify:
    name: review-bot-ack-queue-verify
    if: github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      checks: write
      contents: read
      pull-requests: read
    steps:
      - name: Harden runner (audit mode)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"

      - name: Require a passed PR-stage gate for the queued entry
        id: verify
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          # refs/heads/gh-readonly-queue/<base>/pr-<number>-<base sha>
          QUEUE_REF: ${{ github.event.merge_group.head_ref }}
        run: |
          set -euo pipefail
          echo "queue ref: $QUEUE_REF"
          pr="$(printf '%s' "$QUEUE_REF" | sed -nE 's#.*/pr-([0-9]+)-[0-9a-f]+$#\1#p')"
          if [ -z "$pr" ]; then
            echo "::error::cannot resolve a pull request number from the merge_group ref; refusing to satisfy a required context blind"
            exit 1
          fi
          head_sha="$(gh api "repos/$REPO/pulls/$pr" --jq .head.sha)"
          if [ -z "$head_sha" ]; then
            echo "::error::pull request #$pr resolved from the queue ref does not exist"
            exit 1
          fi
          echo "pr #$pr head $head_sha"
          ok="$(gh api "repos/$REPO/commits/$head_sha/check-runs?check_name=review-bot-ack&per_page=100" \
                --jq '[.check_runs[] | select(.status == "completed" and .conclusion == "success")] | length')"
          if [ "${ok:-0}" -lt 1 ]; then
            echo "::error::no successful review-bot-ack check-run exists on pr #$pr head $head_sha; the PR-stage gate has not passed"
            exit 1
          fi
          echo "PR-stage gate passed on the queued entry's head commit ($ok successful instance(s))"

      - name: Resolve verdict
        if: ${{ !cancelled() }}
        env:
          OUTCOME: ${{ steps.verify.outcome }}
        run: |
          set -euo pipefail
          # Fail closed. Only a clean success publishes success; every other
          # outcome, including a crash, blocks the queue entry.
          verdict=failure
          if [ "$OUTCOME" = "success" ]; then
            verdict=success
          fi
          echo "VERDICT=$verdict" >> "$GITHUB_ENV"

      - name: Publish the review-bot-ack context on the queued group
        # Never publish while being cancelled: a cancelled job has no verdict,
        # and an absent required context correctly reads as blocked.
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.merge_group.head_sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 scripts/publish_required_check.py \
            --repo "$REPO" \
            --sha "$HEAD_SHA" \
            --name review-bot-ack \
            --conclusion "$VERDICT" \
            --title "Queued entry inherits its PR-stage gate verdict" \
            --summary "Resolved the queue entry's pull request and required a successful PR-stage review-bot-ack check-run on its head commit." \
            --details-url "$RUN_URL"

      - name: Reflect the verdict in this job
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          if [ "$VERDICT" != "success" ]; then
            echo "::error::queued entry did not inherit a passing PR-stage gate"
            exit 1
          fi

  pr-gate:
    name: review-bot-ack-runner
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event.pull_request != null && github.event_name != 'merge_group'
    permissions:
      checks: write
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Harden runner (audit mode)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      # Check out the BASE branch, never the pull request's head.
      #
      # Both scripts this job runs reach the pull request over the API and
      # need nothing from its tree, so taking the head bought nothing and
      # cost two things.
      #
      # Availability: the required context is published by
      # `scripts/publish_required_check.py`, which only exists on branches
      # cut after it landed. On an older branch the step died with
      # "can't open file ... publish_required_check.py", so the context was
      # never published AT ALL and the pull request sat at BLOCKED with no
      # failing required check to point at. Four contributor pull requests
      # were stuck this way at once.
      #
      # Security: this job holds `pull-requests: write` and `issues: write`.
      # Running Python out of a fork's tree with those permissions lets the
      # fork author execute arbitrary code against this repository. Taking
      # the base branch removes that entirely.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.ref }}

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"

      - name: Run review-bot acknowledgement gate
        id: gate
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python3 scripts/review_bot_ack.py \
            --owner "$OWNER" \
            --repo "$REPO_NAME" \
            --pr "$PR_NUMBER"

      - name: Resolve verdict
        if: ${{ !cancelled() }}
        env:
          OUTCOME: ${{ steps.gate.outcome }}
        run: |
          set -euo pipefail
          # Fail closed. The gate exits 1 on an unresolved must-address
          # finding and 2 on an internal error; both must block the merge, so
          # only a clean success publishes success.
          verdict=failure
          if [ "$OUTCOME" = "success" ]; then
            verdict=success
          fi
          echo "VERDICT=$verdict" >> "$GITHUB_ENV"

      # The verdict is handed to `review-bot-ack-publish.yml` rather than
      # published here.
      #
      # A `pull_request` event raised from a fork gets a read-only
      # GITHUB_TOKEN, and a `permissions:` block cannot raise it: that cap is
      # GitHub's, not ours. Publishing from this job therefore failed with
      # `403 Resource not accessible by integration` on every fork pull
      # request, which left the required context absent and the contribution
      # permanently unmergeable. Measured on one day: four fork pull requests
      # got 403, the one same-repo pull request published fine.
      #
      # `workflow_run` runs in the base repository's context with the base
      # token, so the publisher there can hold `checks: write` for a fork
      # pull request exactly as it does for a branch one.
      - name: Hand the verdict to the publisher
        if: ${{ !cancelled() }}
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mkdir -p verdict
          printf '%s\n' "$VERDICT" > verdict/conclusion
          printf '%s\n' "$HEAD_SHA" > verdict/head_sha

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: review-bot-ack-verdict
          path: verdict/
          retention-days: 1

      # Best-effort direct publish, kept alongside the handoff for two
      # reasons.
      #
      # Bootstrap: `workflow_run` only fires for workflows that exist on the
      # default branch, so a pull request that introduces or edits the
      # companion publisher cannot be published by it and would be unable to
      # satisfy its own required context.
      #
      # Latency: a same-repo pull request gets the context immediately here
      # rather than after a second workflow schedules.
      #
      # `continue-on-error` is what makes this safe to keep. On a fork the
      # token is read-only and this step 403s; swallowing that is correct,
      # because the `workflow_run` publisher is the authoritative path and
      # would otherwise see a failed gate run and publish `failure` for a
      # pull request that actually passed. The publish script upserts a
      # single terminal check-run per head SHA, so both paths running is
      # idempotent rather than duplicative.
      - name: Publish directly when the token allows it
        id: direct_publish
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 scripts/publish_required_check.py \
            --repo "$REPO" \
            --sha "$HEAD_SHA" \
            --name review-bot-ack \
            --conclusion "$VERDICT" \
            --title "Review-bot acknowledgement gate" \
            --summary "Every must-address CodeRabbit and Sourcery finding must be fixed in a later commit or acknowledged in the PR body. See the sticky summary comment on the pull request for the per-finding breakdown." \
            --details-url "$RUN_URL"

      - name: Reflect the verdict in this job
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          if [ "$VERDICT" != "success" ]; then
            echo "::error::unresolved must-address review-bot findings; see the sticky summary comment on the PR"
            exit 1
          fi
