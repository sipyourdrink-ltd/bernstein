name: docs-build

# Builds the Read the Docs site (mkdocs.yml) with warnings promoted to
# errors, the same way `mkdocs build --strict` would run on Read the Docs
# itself (see .readthedocs.yaml). Catches a broken toctree, a dead
# internal link, or a docs/requirements.txt pin that no longer resolves,
# on the pull request instead of after RTD has already gone dark.

on:
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".readthedocs.yaml"
      - "docs/requirements.txt"
      - "docs/requirements.in"
      - "pyproject.toml"
      - ".github/workflows/docs-build.yml"
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".readthedocs.yaml"
      - "docs/requirements.txt"
      - "docs/requirements.in"
      - "pyproject.toml"
      - ".github/workflows/docs-build.yml"

permissions:
  contents: read

jobs:
  build:
    # GitHub-hosted, not self-hosted: this job runs on `pull_request`, which
    # can carry a contributor's revision (see
    # tests/unit/test_self_hosted_runner_scope.py).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden runner (audit mode)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2.21.1
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          enable-cache: true
      - name: Install docs toolchain
        run: uv sync --group docs
      - name: mkdocs build --strict
        run: uv run --group docs mkdocs build --strict
