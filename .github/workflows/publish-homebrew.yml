name: Publish Homebrew Formula

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 1.4.0)"
        required: true

concurrency:
  group: publish-homebrew-${{ github.ref }}
  cancel-in-progress: false

# The cross-repo push targets chernistry/homebrew-tap via HOMEBREW_TAP_TOKEN,
# not GITHUB_TOKEN on this repo, so the workflow token can stay read-only
# (Scorecard token-permissions).
permissions:
  contents: read

jobs:
  update-formula:
    name: Update Homebrew formula
    runs-on: ubuntu-latest
    # Approval lives on publish.yml's `publish` job (PyPI trusted
    # publishing, OIDC-scoped to the pypi environment). This job pushes to
    # the tap with HOMEBREW_TAP_TOKEN instead, so it has no environment-
    # scoped credential that the approval was protecting.
    environment: release-channels
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      # The environment this job's secrets are read from, named so the preflight
      # below can say WHERE to define a missing one. Kept in step with the
      # `environment:` key above by tests/unit/test_publish_homebrew_workflow_yaml.py --
      # a preflight that named the wrong environment would send an operator to
      # define the secret somewhere this job will never read it.
      RELEASE_ENVIRONMENT: release-channels
    steps:
      - name: Harden runner (audit mode)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Get version and SHA
        id: meta
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          # The version is interpolated straight into the sdist URL and into the
          # published formula, and workflow_dispatch's `required: true` only means
          # "not omitted": it accepts `latest`, a stray space, or anything else a
          # hand-typed dispatch produces. Reject it here so the failure names the
          # cause, instead of surfacing three steps later as a formula pinned to a
          # release that does not exist.
          #
          # Two separate rules, because "not publishable" and "not a version"
          # are different outcomes. The first pattern is the set scripts/
          # bump_version.py can produce and publish.yml therefore dispatches;
          # anything outside it is a typo or a misconfigured dispatch and is an
          # error. The second is narrower: a tap's stable formula must not
          # track a pre-release, dev, post, or local version, so those exit
          # successfully as a deliberate skip rather than failing the run that
          # a legitimate `v3.15.0rc1` tag would otherwise turn red.
          # tests/unit/test_homebrew_formula.py pins the first pattern to
          # bump_version.py so the two cannot drift apart.
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-+.]?[0-9A-Za-z.-]+)?$'; then
            echo "::error::'${VERSION}' is not a version this project's release tooling can produce."
            exit 1
          fi
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::notice::'${VERSION}' is not a final release; Homebrew publishes final releases only."
            echo "'${VERSION}' is not a final release; skipped Homebrew publication." >> "$GITHUB_STEP_SUMMARY"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          # `curl -sL` exits 0 on an HTTP error and writes the error body to
          # stdout, so piping it into sha256sum hashes the 404 page. That digest
          # is non-empty and is not the empty-file digest, so it passed both
          # previous guards -- and the published formula would then carry a
          # sha256 that disagrees with its own url, failing every `brew install`
          # at checksum verification. Fetch to a file with --fail, and confirm
          # the bytes really are a gzip stream before hashing them.
          URL="https://files.pythonhosted.org/packages/source/b/bernstein/bernstein-${VERSION}.tar.gz"
          for i in 1 2 3 4 5; do
            if curl --fail --location --silent --show-error "$URL" -o /tmp/sdist.tar.gz \
              && gzip --test /tmp/sdist.tar.gz; then
              SHA=$(sha256sum /tmp/sdist.tar.gz | cut -d' ' -f1)
              echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
              echo "Found SHA: $SHA"
              break
            fi
            rm -f /tmp/sdist.tar.gz
            echo "sdist for ${VERSION} is not fetchable yet; waiting for PyPI to propagate (attempt $i)"
            sleep 30
          done

      # Preflight, before the formula is rendered (#5826).
      #
      # v3.19.2 failed at the LAST step -- the cross-repo push -- with
      # "HOMEBREW_TAP_TOKEN secret not set", after the version was resolved, the
      # sdist was hashed and the formula was written. Everything before that step
      # was wasted, and the error named the secret without naming the one thing an
      # operator needed: WHICH environment to define it on.
      #
      # That is the whole defect. #5819 moved this job from `pypi` to
      # `release-channels`, and an environment secret does not follow a job across
      # environments -- the value still exists on `pypi`, so the secret "is set"
      # from every angle except the one that matters here.
      - name: Check the tap credential is defined on this environment
        # After `meta`, so a pre-release version still takes its deliberate skip
        # path instead of being turned into a credential failure.
        if: steps.meta.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${GH_TOKEN:-}" ]; then
            echo "HOMEBREW_TAP_TOKEN is defined on ${RELEASE_ENVIRONMENT}"
            exit 0
          fi
          echo "::error::HOMEBREW_TAP_TOKEN is not defined on the '${RELEASE_ENVIRONMENT}' environment, which is the one this job reads. A value defined on another environment is not visible here. Define it with: gh secret set HOMEBREW_TAP_TOKEN --env ${RELEASE_ENVIRONMENT} -R ${GITHUB_REPOSITORY}"
          exit 1

      - name: Generate formula
        if: steps.meta.outputs.skip != 'true'
        env:
          META_VERSION: ${{ steps.meta.outputs.version }}
          META_SHA256: ${{ steps.meta.outputs.sha256 }}
        run: |
          # The formula body is packaging/homebrew/bernstein.rb. It used to be a
          # second copy inlined here, and the two drifted: the checked-in
          # template carried a warning that the install strategy was broken while
          # this heredoc -- the copy that actually reaches the tap -- kept
          # shipping it (#3573). Only the version and the tarball digest are
          # substituted here; anything else about the formula is a repository
          # change reviewed like any other.
          if [ -z "$META_SHA256" ]; then
            echo "::error::PyPI sdist digest for ${META_VERSION} never resolved; refusing to publish a formula whose sha256 would be empty."
            exit 1
          fi

          sed -e "s|bernstein-VERSION.tar.gz|bernstein-${META_VERSION}.tar.gz|" \
              -e "s|PLACEHOLDER|${META_SHA256}|" \
              packaging/homebrew/bernstein.rb > /tmp/bernstein.rb

          if grep -q "PLACEHOLDER\|bernstein-VERSION" /tmp/bernstein.rb; then
            echo "::error::formula still carries a template placeholder after substitution."
            exit 1
          fi
          cat /tmp/bernstein.rb

      - name: Push to homebrew-tap repo
        if: steps.meta.outputs.skip != 'true'
        env:
          # HOMEBREW_TAP_TOKEN must be a PAT with `repo` scope for
          # chernistry/homebrew-tap. Without it the cross-repo push fails;
          # the step previously masked that failure via continue-on-error.
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          META_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          # Kept as a backstop: the preflight above is what should catch this,
          # and this step must still refuse rather than push anonymously if it
          # is ever reached (a dry run promoted to a real one, a reordering).
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::HOMEBREW_TAP_TOKEN is not defined on the '${RELEASE_ENVIRONMENT}' environment. It needs a PAT with repo scope for chernistry/homebrew-tap."
            exit 1
          fi

          # Clone the tap with the PAT baked into the URL so subsequent
          # `git push` authenticates as the token owner. `gh repo clone`
          # used the runner's gh-token context for the HTTPS handshake but
          # then dropped the credential, so plain `git push` later failed
          # with "could not read Username for 'https://github.com'".
          TAP_URL="https://x-access-token:${GH_TOKEN}@github.com/chernistry/homebrew-tap.git"
          if ! git ls-remote "$TAP_URL" > /dev/null 2>&1; then
            echo "::error::homebrew-tap repo not reachable. Create it (gh repo create chernistry/homebrew-tap --public) or check token scope."
            exit 1
          fi
          git clone "$TAP_URL" /tmp/homebrew-tap

          mkdir -p /tmp/homebrew-tap/Formula
          cp /tmp/bernstein.rb /tmp/homebrew-tap/Formula/bernstein.rb

          cd /tmp/homebrew-tap
          git config user.name "bernstein[bot]"
          git config user.email "bernstein-bot@users.noreply.github.com"
          git add Formula/bernstein.rb
          if git diff --cached --quiet; then
            echo "No changes to publish - formula already at ${META_VERSION}."
            exit 0
          fi
          git commit -m "bernstein ${META_VERSION}"
          git push
