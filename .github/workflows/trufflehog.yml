name: trufflehog (secret scanning)

# Scan commits and PRs for accidentally-committed secrets (API keys,
# private keys, tokens). trufflehog is OSS / free for orgs too -
# gitleaks-action requires a paid GITLEAKS_LICENSE for organization
# accounts, so we use trufflehog as the public-org-friendly alternative.
#
# Ref: #1273

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 6 * * 1"  # Weekly, Monday 06:23 UTC
  workflow_dispatch:

concurrency:
  group: trufflehog-${{ github.ref }}
  # Cancel superseded runs only for PRs. A push-to-main scan must never be
  # cancelled by the next merge landing seconds later: a cancelled run shows
  # grey, not red, so the earlier commit would silently lose its scan.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  trufflehog:
    name: trufflehog scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Full history so trufflehog can scan all commits introduced by
          # the PR (it diffs base..head).
          fetch-depth: 0
          persist-credentials: false

      - name: Run trufflehog
        uses: trufflesecurity/trufflehog@20652fbbdefffcdaa493a5bf57ab2ac6b1db715b  # v3.97.1
        with:
          # The `uses:` SHA above pins the action, which is a shell wrapper;
          # the wrapper runs `ghcr.io/trufflesecurity/trufflehog:${version}`,
          # and that input defaults to `latest`. Unpinned, a detector added
          # upstream arrives on whichever pull request is open when it ships,
          # and reads as that author's fault. Renovate bumps this together
          # with the `uses:` SHA - see the `trufflehog` group in
          # `renovate.json` - and `tests/unit/test_trufflehog_workflow_yaml.py`
          # fails if the two ever name different releases.
          # renovate: datasource=docker depName=ghcr.io/trufflesecurity/trufflehog
          version: 3.97.1
          # Only report verified secrets - keeps signal-to-noise high and
          # lets the job act as a hard gate. Unknown / unverified results
          # are dominated by test-fixture connection strings like
          # `postgres://user:pass@host` that trufflehog cannot probe but
          # are not real credentials; gating on those forced every push
          # to main red without a real leak.
          #
          # `lob` is excluded because its verifier reports a positive for
          # any `test_`-prefixed string of exactly 35 further characters,
          # which is a shape ordinary Python test names land on. Three
          # randomly generated names of that shape - which cannot be keys -
          # scanned as `verified_secrets: 3`, so the verdict carries no
          # information about whether a credential is present. It has twice
          # turned main red: on `test_public_key_jwk_embedded_and_correct`,
          # and on `test_required_check_canary_workflow_yaml`, the latter a
          # test *filename* quoted in `docs/operations/merge-queue.md`.
          # Since the detector cannot distinguish a key from prose, and
          # this project has no Lob integration to leak a key for, keeping
          # it enabled only teaches contributors to disregard the gate.
          #
          # This is the whole exclusion list, and
          # `tests/unit/test_trufflehog_workflow_yaml.py` fails if it grows
          # - a detector for a service we do use must not be dropped here.
          extra_args: --results=verified --exclude-detectors=lob
