name: PR observability summary
# Manual runs have no PR association in workflow_run. The publisher accepts
# this number only from a dispatch of the default branch.
run-name: PR observability summary for ${{ github.event.pull_request.number || inputs.pr_number }}

on:
  pull_request:
    # `labeled` is in the list because the job is gated on the deep-review
    # label, which is usually applied after the PR is already open; without
    # it, adding the label does nothing until the next push.
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to summarise (dispatch only)
        required: true

concurrency:
  group: pr-observability-${{ github.event.pull_request.number || github.event.inputs.pr_number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  summary:
    name: Build observability summary
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      checks: read
      contents: read
      pull-requests: read
      security-events: read
    # Opt-in on PRs: the observability fan-out only runs when the PR carries
    # the 'deep-review' label, so ordinary PR pushes skip it. The manual
    # workflow_dispatch path stays unconditional so an operator can summarise
    # any PR on demand.
    if: >
      (github.event_name == 'pull_request' &&
       contains(github.event.pull_request.labels.*.name, 'deep-review')) ||
      github.event_name == 'workflow_dispatch'
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2  # v2.22.2
        with:
          egress-policy: audit
          disable-sudo: true

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # Inline the pinned bootstrap inputs so no local action is resolved from the PR.
      - name: Set up uv
        id: setup_uv
        continue-on-error: true
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with: &uv-inputs
          version: '0.13.7'
          enable-cache: false
          python-version: '3.13'

      - name: Retry uv setup after a transient failure
        if: steps.setup_uv.outcome == 'failure'
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with: *uv-inputs

      - name: Install bernstein
        run: |
          uv sync --group dev

      - name: Run doctor observe (JSON)
        id: observe
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p .ci/observability
          uv run bernstein doctor observe --json --no-persist \
            > .ci/observability/observe.json || true

      - name: Report required-context presence on the PR head
        # A head commit missing a required check context produces the same
        # empty failure list as one whose checks all passed. This step names
        # which of the two the PR is in. Advisory: `continue-on-error` keeps
        # the report out of the gate - mergeability is still decided by the
        # required contexts themselves.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.inputs.pr_number }}
        run: |
          set -uo pipefail
          report="$(uv run python scripts/check_required_contexts.py --pr "$PR_NUMBER" 2>&1)" && rc=0 || rc=$?
          {
            echo "### Required-context presence"
            echo ""
            echo '```text'
            echo "$report"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "$report"
          exit "$rc"

      - name: Build PR summary markdown
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.inputs.pr_number }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref || '' }}
        run: |
          set -euo pipefail
          uv run python scripts/observability/build_pr_summary.py \
            --observe .ci/observability/observe.json \
            --pr "$PR_NUMBER" \
            --branch "$PR_BRANCH" \
            --out .ci/observability/pr_summary.md

      - name: Append summary to job step summary
        run: cat .ci/observability/pr_summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Check observation size
        if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
        run: test "$(wc -c < .ci/observability/observe.json)" -le 65536

      - name: Hand observations to the comment publisher
        if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr-observations-${{ github.run_attempt }}
          path: .ci/observability/observe.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
