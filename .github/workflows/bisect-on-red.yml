name: Bisect on Red

# When CI fails on main, walk back through the last N merges and use
# `git log` to identify the merge commit that introduced the failing
# workflow's regression. Comment on the culprit PR with the failing
# job name and the offending sha. Applies a `regression` label so the
# PR author is auto-triaged.
#
# On first red, walk the recent-merge timeline and pin the most likely
# introducing commit before the on-call has to run `git bisect` by
# hand.
#
# This is the cheap, log-only flavor: we do not re-run the failing job
# against intermediate commits (that would burn N runner-minutes per
# red event). Instead we report the most-likely culprit based on file
# overlap between the failing workflow's scope and each candidate
# merge's diff. Operators can escalate to manual bisect from there.
#
# Trigger: invoked by `post-ci-dispatcher.yml` via workflow_call so the
# fanout shares a single dispatcher boot with the other post-CI children.

on:
  workflow_call:
    inputs:
      head_sha:
        description: Full 40-char SHA the upstream CI run executed on.
        required: true
        type: string
      run_id:
        description: GitHub Actions run id of the upstream CI run.
        required: true
        type: string
      html_url:
        description: HTML URL of the upstream CI run.
        required: true
        type: string

permissions: {}

jobs:
  bisect:
    name: Identify culprit PR
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Harden runner (audit mode)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout main with history
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7  # zizmor: ignore[artipacked]
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Identify the failing job(s)
        id: failing
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          set -euo pipefail

          # Extract failing job names from the CI run.
          FAILED_JOBS=$(gh api "repos/${REPO}/actions/runs/${RUN_ID}/jobs" \
            --jq '[.jobs[] | select(.conclusion == "failure") | .name] | unique | join(", ")' \
            2>/dev/null || echo "")

          if [ -z "${FAILED_JOBS}" ]; then
            FAILED_JOBS="(unspecified)"
          fi

          echo "Failing jobs: ${FAILED_JOBS}"
          echo "jobs=${FAILED_JOBS}" >> "${GITHUB_OUTPUT}"

      - name: Walk last 5 merges and rank by likelihood
        id: bisect
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ inputs.head_sha }}
          FAILED_JOBS: ${{ steps.failing.outputs.jobs }}
          RUN_URL: ${{ inputs.html_url }}
        run: |
          set -euo pipefail

          # The regression window is the first-parent commits between the
          # last sha CI passed on (exclusive) and HEAD_SHA (inclusive).
          # Blaming anything outside this window is a false positive: a
          # large historical commit must never be re-accused for an
          # unrelated later red. This repository squash-merges, so most PRs
          # land as regular commits, not merge commits; walking `--merges`
          # kept re-surfacing the few true merge commits (the source of the
          # old recurring misfire), so we walk first-parent commits and
          # bound them by the last green baseline instead.
          LAST_GREEN=$(gh api \
            "repos/${REPO}/actions/workflows/ci.yml/runs?branch=main&status=success&per_page=1" \
            --jq '.workflow_runs[0].head_sha // empty' 2>/dev/null || echo "")

          CANDIDATES=()
          if [ -n "${LAST_GREEN}" ] \
            && git merge-base --is-ancestor "${LAST_GREEN}" "${HEAD_SHA}" 2>/dev/null; then
            mapfile -t CANDIDATES < <(
              git log --first-parent --format='%H' "${LAST_GREEN}..${HEAD_SHA}"
            )
          fi

          # No resolvable green baseline: inspect only the single most
          # recent first-parent commit, never a stale multi-commit window.
          if [ "${#CANDIDATES[@]}" -eq 0 ]; then
            mapfile -t CANDIDATES < <(
              git log --first-parent -n 1 --format='%H' "${HEAD_SHA}"
            )
          fi

          # Cap the window so a long red streak cannot accuse a big batch
          # of commits at once.
          if [ "${#CANDIDATES[@]}" -gt 10 ]; then
            CANDIDATES=("${CANDIDATES[@]:0:10}")
          fi

          if [ "${#CANDIDATES[@]}" -eq 0 ]; then
            echo "::warning::No candidate commits in the regression window. Nothing to bisect."
            exit 0
          fi

          echo "Regression window: ${#CANDIDATES[@]} commit(s) since last green ${LAST_GREEN:0:7}"

          # Heuristic ranking: score each candidate by the number of
          # files it touched. Largest-diff candidates are inspected
          # first since they are more likely to introduce regressions
          # in CI surface area. This is a deliberately simple ranking;
          # tuning lives in operator dashboards, not here.
          BEST_SHA=""
          BEST_SCORE=0
          BEST_MSG=""
          for sha in "${CANDIDATES[@]}"; do
            score=$(git show --stat --format='' "${sha}" 2>/dev/null | wc -l | tr -d ' ')
            if [ "${score}" -gt "${BEST_SCORE}" ]; then
              BEST_SCORE="${score}"
              BEST_SHA="${sha}"
              BEST_MSG=$(git log -1 --format='%s' "${sha}")
            fi
          done

          if [ -z "${BEST_SHA}" ]; then
            echo "::warning::Ranking produced no candidate."
            exit 0
          fi

          echo "Top suspect: ${BEST_SHA} (${BEST_SCORE} files) :: ${BEST_MSG}"
          echo "suspect_sha=${BEST_SHA}" >> "${GITHUB_OUTPUT}"
          echo "suspect_msg=${BEST_MSG}" >> "${GITHUB_OUTPUT}"

          # Find PR number associated with the suspect merge commit.
          PR_NUMBER=$(printf '%s' "${BEST_MSG}" \
            | grep -oE '#[0-9]+' \
            | head -1 \
            | tr -d '#' \
            || true)

          if [ -z "${PR_NUMBER}" ]; then
            PR_NUMBER=$(gh api "repos/${REPO}/commits/${BEST_SHA}/pulls" \
              --jq '.[0].number // empty' 2>/dev/null || echo "")
          fi

          if [ -z "${PR_NUMBER}" ]; then
            echo "::notice::No PR linkable to suspect ${BEST_SHA:0:7}. Skipping comment."
            exit 0
          fi

          echo "Will annotate PR #${PR_NUMBER}"

          BODY_FILE=$(mktemp)
          {
            printf '## Bisect-on-red triage\n\n'
            printf 'The CI workflow failed on `%s`. Among the commits since the last green CI run on main, this PR (`%s`) is the highest-impact candidate (touched %s files).\n\n' \
              "${HEAD_SHA:0:7}" "${BEST_SHA:0:7}" "${BEST_SCORE}"
            printf -- '- **Failing job(s):** %s\n' "${FAILED_JOBS}"
            printf -- '- **Failing run:** %s\n' "${RUN_URL}"
            printf -- '- **Suspect commit:** `%s`\n\n' "${BEST_SHA}"
            printf 'Auto-applied label: `regression`. This is a heuristic ranking (files-touched), not a confirmed bisect. Run `git bisect` locally to confirm before reverting.\n\n'
            printf '_Posted automatically by `bisect-on-red.yml`._\n'
          } > "${BODY_FILE}"

          # Dedup: never post twice for the same failing run, and never
          # re-accuse a PR that already carries a bisect comment for this
          # run. Prevents the recurring-comment spam on a repeatedly
          # re-surfaced suspect.
          ALREADY=$(gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" \
            --jq "[.[] | select(.body | contains(\"${RUN_URL}\"))] | length" \
            2>/dev/null || echo "0")
          if [ "${ALREADY}" != "0" ]; then
            echo "::notice::PR #${PR_NUMBER} already annotated for this run. Skipping."
            exit 0
          fi

          gh pr comment "${PR_NUMBER}" --repo "${REPO}" --body-file "${BODY_FILE}" \
            || echo "::warning::failed to comment on PR #${PR_NUMBER}"

          # Idempotent label add. If the label does not exist, create it
          # then retry once.
          if ! gh pr edit "${PR_NUMBER}" --repo "${REPO}" --add-label "regression" 2>/dev/null; then
            gh label create "regression" --repo "${REPO}" \
              --description "CI failure traced to this PR by bisect-on-red" \
              --color "B60205" 2>/dev/null || true
            gh pr edit "${PR_NUMBER}" --repo "${REPO}" --add-label "regression" \
              || echo "::warning::failed to add label"
          fi
