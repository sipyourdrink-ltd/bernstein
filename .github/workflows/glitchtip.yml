name: GlitchTip

# Consolidated GlitchTip observability workflow. Two independent jobs that
# previously lived in separate files (glitchtip-ingester.yml and
# glitchtip-insights.yml) now share one file to cut the workflow count:
#
#   * ingest -- pulls open unresolved GlitchTip issues into regression eval
#     cases and opens a review-before-merge PR. Fires on its own daily cron
#     (06:23 UTC) or manual dispatch.
#   * sweep  -- mirrors CRITICAL (fatal-level) GlitchTip issues into sticky
#     GitHub issues and auto-closes them when resolved. Fires on its own
#     daily cron (06:30 UTC) or manual dispatch.
#
# Both crons are kept as separate schedule entries and each job is gated on
# github.event.schedule matching its own cron, so the two jobs keep firing
# independently exactly as they did as separate workflows. Per-job
# concurrency groups preserve the original one-run-at-a-time behaviour of
# each job.
#
# No host is hardcoded: base URLs come from repository vars so the
# operator's private observability hostname never appears in this file.
# With the token or base URL unset each job exits 0 and is a no-op, so a
# fresh fork stays green until the operator wires the secrets.

on:
  schedule:
    - cron: '23 6 * * *'  # ingest: 06:23 UTC daily; 6 min after the Sonar sweeper.
    - cron: "30 6 * * *"  # sweep:  06:30 UTC daily.
  workflow_dispatch:
    inputs:
      severity_min:
        description: Minimum severity to include (synthesized cases are P1)
        required: false
        default: P1
        type: choice
        options:
          - P0
          - P1
          - P2
      max_per_day:
        description: Cap on records emitted in this run
        required: false
        default: '10'
      dry_run:
        description: When true, only print the would-be records
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'
      org_slug:
        description: "GlitchTip organisation slug (default: bernstein)"
        required: false
        default: "bernstein"
      base_url:
        description: "GlitchTip base URL (e.g. https://errors.example.com). Defaults to vars.GLITCHTIP_BASE_URL."
        required: false
        default: ""

permissions:
  contents: read

jobs:
  ingest:
    name: Ingest GlitchTip events
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Fire on the ingester's own cron (06:23 UTC) or manual dispatch, and
    # only when a base URL is configured.
    if: >-
      ${{ vars.BERNSTEIN_GLITCHTIP_BASE_URL != '' &&
          (github.event_name == 'workflow_dispatch' ||
           github.event.schedule == '23 6 * * *') }}
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: glitchtip-ingester
      cancel-in-progress: false
    env:
      # Cron enabled: a clean workflow_dispatch smoke run opened a real
      # eval-case PR, so the daily ingest path is proven. Emitted cases are
      # redacted P1 (warn-only) YAML; the scheduled run stays a
      # review-before-merge PR and never pushes to main. Job 'if:' cannot
      # read env directly, so the gate runs as the first step of the job
      # (see "Gate cron trigger").
      ENABLE_CRON: '1'
    steps:
      - name: Gate cron trigger
        id: gate
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "schedule" ] && [ "${ENABLE_CRON}" != "1" ]; then
            echo "Cron trigger fired but ENABLE_CRON is '0'; exiting cleanly."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Harden runner
        if: steps.gate.outputs.skip != 'true'
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920  # v2.20.0
        with:
          egress-policy: audit
          disable-sudo: true

      - name: Checkout
        if: steps.gate.outputs.skip != 'true'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up uv
        if: steps.gate.outputs.skip != 'true'
        uses: ./.github/actions/bootstrap
        with:
          python-version: '3.13'

      - name: Install project deps
        if: steps.gate.outputs.skip != 'true'
        run: |
          uv sync --group dev

      - name: Scrape GlitchTip events
        if: steps.gate.outputs.skip != 'true'
        id: scrape
        env:
          # Token is a secret; base URL and org are non-secret vars so
          # the operator's private hostname never lands in this file.
          GLITCHTIP_API_TOKEN: ${{ secrets.GLITCHTIP_API_TOKEN }}
          BERNSTEIN_GLITCHTIP_BASE_URL: ${{ vars.BERNSTEIN_GLITCHTIP_BASE_URL }}
          BERNSTEIN_GLITCHTIP_ORG: ${{ vars.BERNSTEIN_GLITCHTIP_ORG }}
          DRY_RUN_INPUT: ${{ inputs.dry_run || 'false' }}
        run: |
          set -euo pipefail
          mkdir -p .sdd/reports/glitchtip_events
          args=(
            "--out" ".sdd/reports/glitchtip_events"
            "--cases-dir" "src/bernstein/eval/cases/incidents"
          )
          if [ "${DRY_RUN_INPUT}" = "true" ]; then
            args+=("--dry-run")
          fi
          uv run python scripts/scrape_glitchtip_events.py "${args[@]}"

      - name: Synthesize eval cases
        if: >-
          steps.gate.outputs.skip != 'true' &&
          inputs.dry_run != 'true'
        run: |
          set -euo pipefail
          uv run bernstein eval sync-incidents --workdir .

      - name: Detect new eval-case files
        if: >-
          steps.gate.outputs.skip != 'true' &&
          inputs.dry_run != 'true'
        id: detect
        run: |
          set -euo pipefail
          # Only files under the incidents corpus count toward the PR so
          # the scope stays tight. The scraper's JSON records under
          # .sdd/ are runtime state and are not committed.
          changed=$(git status --porcelain -- src/bernstein/eval/cases/incidents/ | wc -l | tr -d ' ')
          echo "changed=${changed}" >> "$GITHUB_OUTPUT"
          if [ "${changed}" = "0" ]; then
            echo "No new eval cases emitted; will skip PR creation."
          else
            echo "${changed} new eval-case file(s) to commit."
          fi

      - name: Open PR with new eval cases
        if: >-
          steps.gate.outputs.skip != 'true' &&
          steps.detect.outputs.changed != '0' &&
          inputs.dry_run != 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1  # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: glitchtip-ingest/${{ github.run_id }}
          delete-branch: true
          add-paths: |
            src/bernstein/eval/cases/incidents/
          commit-message: |
            chore(eval): import glitchtip regression cases
          title: 'chore(eval): import glitchtip regression cases'
          body: |
            Automated import of open unresolved GlitchTip issues as
            regression eval cases under
            `src/bernstein/eval/cases/incidents/`. Generated by
            `.github/workflows/glitchtip.yml`.

            Each emitted case carries `source_incident:
            glitchtip-issue:<issue_id>` and `severity: P1` (warn-only).
            Re-runs are idempotent: the same issue will not produce a
            second case.

            Administrative wiring-probe issues are filtered out by the
            allow-list in `scripts/scrape_glitchtip_events.py`. If a new
            probe title appears, add it to
            `DEFAULT_WIRING_PROBE_ALLOW_LIST` before merging.

            See `docs/operations/glitchtip-ingester.md` for the env-var
            matrix, the dedup contract, and the severity-mapping note.
          labels: |
            eval
            regression
            chore

  sweep:
    name: sweep
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Fire on the sweep's own cron (06:30 UTC) or manual dispatch.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.schedule == '30 6 * * *'
    permissions:
      contents: read
      issues: write
    concurrency:
      group: glitchtip-insights
      cancel-in-progress: false
    # The API token is scoped to the single fetch step that needs it rather
    # than exposed at workflow/job level, so no other step inherits the
    # secret in its environment. Base URL, org, and label are non-secret.
    env:
      GLITCHTIP_BASE_URL: ${{ github.event.inputs.base_url || vars.GLITCHTIP_BASE_URL }}
      GLITCHTIP_ORG: ${{ github.event.inputs.org_slug || 'bernstein' }}
      GLITCHTIP_LABEL: glitchtip-alert
    steps:
      - name: Check token + base URL presence
        id: check_token
        env:
          TOKEN_PRESENT: ${{ secrets.GLITCHTIP_API_TOKEN != '' }}
          BASE_URL_PRESENT: ${{ env.GLITCHTIP_BASE_URL != '' }}
        run: |
          if [ "${TOKEN_PRESENT}" != "true" ]; then
            echo "::notice::GLITCHTIP_API_TOKEN is not configured; skipping sweep."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif [ "${BASE_URL_PRESENT}" != "true" ]; then
            echo "::notice::GLITCHTIP_BASE_URL is not configured; skipping sweep."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch fatal-level issues (last 24h)
        if: steps.check_token.outputs.skip == 'false'
        id: fetch
        env:
          GLITCHTIP_API_TOKEN: ${{ secrets.GLITCHTIP_API_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p .glitchtip-sweep
          url="${GLITCHTIP_BASE_URL%/}/api/0/organizations/${GLITCHTIP_ORG}/issues/?statsPeriod=24h&query=level:fatal+is:unresolved&limit=100"
          http_code=$(curl -sS -o .glitchtip-sweep/unresolved.json -w "%{http_code}" \
              -H "Authorization: Bearer ${GLITCHTIP_API_TOKEN}" \
              "$url")
          if [ "$http_code" != "200" ]; then
            echo "GlitchTip API returned HTTP $http_code; aborting." >&2
            cat .glitchtip-sweep/unresolved.json >&2 || true
            exit 1
          fi
          # Resolved+ignored mirror so we can close stale GitHub issues.
          resolved_url="${GLITCHTIP_BASE_URL%/}/api/0/organizations/${GLITCHTIP_ORG}/issues/?statsPeriod=7d&query=level:fatal+is:resolved&limit=100"
          resolved_http_code=$(curl -sS -o .glitchtip-sweep/resolved.json -w "%{http_code}" \
              -H "Authorization: Bearer ${GLITCHTIP_API_TOKEN}" \
              "$resolved_url")
          if [ "$resolved_http_code" != "200" ]; then
            echo "GlitchTip resolved API returned HTTP $resolved_http_code; aborting." >&2
            cat .glitchtip-sweep/resolved.json >&2 || true
            exit 1
          fi

      - name: Reconcile GitHub issues
        if: steps.check_token.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import subprocess
          import sys
          import urllib.parse
          from pathlib import Path

          LABEL = os.environ["GLITCHTIP_LABEL"]
          REPO = os.environ["REPO"]
          BASE_URL = os.environ["GLITCHTIP_BASE_URL"].rstrip("/")
          ORG = os.environ["GLITCHTIP_ORG"]

          # Server-supplied strings (issue title, level, permalink) are
          # untrusted: they land in world-readable GitHub issues. Neutralise
          # anything that could @-mention a user/team, break out of a
          # markdown code span, or smuggle a link to an unexpected host.
          def _neutralize_mentions(text: str) -> str:
              # Replace @ with the fullwidth variant so GitHub cannot linkify
              # a user or team mention from server-controlled text.
              return text.replace("@", "＠")

          def _sanitize_title(text: str) -> str:
              # Collapse whitespace/newlines and defang mentions. GitHub
              # titles are plain text, but a title copied into a comment or
              # body would otherwise mention; keep it inert either way.
              return _neutralize_mentions(" ".join(text.split()))

          def _code_span(value: str) -> str:
              # Safe to interpolate inside a `...` span: strip backticks so
              # the value cannot terminate the span, and defang mentions.
              return _neutralize_mentions(str(value).replace("`", "'"))

          def _safe_permalink(permalink: str) -> str | None:
              # Only embed a clickable link when its host matches the
              # configured GlitchTip host; drop it otherwise.
              try:
                  parsed = urllib.parse.urlparse(permalink)
                  base = urllib.parse.urlparse(BASE_URL)
              except ValueError:
                  return None
              if parsed.scheme not in ("http", "https"):
                  return None
              if parsed.netloc and base.netloc and parsed.netloc.lower() == base.netloc.lower():
                  return permalink
              return None

          def gh(*args: str, capture: bool = False) -> str:
              proc = subprocess.run(
                  ["gh", *args, "--repo", REPO],
                  check=True,
                  text=True,
                  capture_output=True,
              )
              return proc.stdout if capture else ""

          def ensure_label() -> None:
              try:
                  subprocess.run(
                      ["gh", "label", "create", LABEL,
                       "--repo", REPO,
                       "--color", "B60205",
                       "--description", "Auto-opened by glitchtip-insights workflow"],
                      check=False, capture_output=True,
                  )
              except Exception:
                  pass

          def load(path: str) -> list[dict]:
              raw = Path(path).read_text(encoding="utf-8")
              try:
                  data = json.loads(raw)
              except json.JSONDecodeError:
                  return []
              return data if isinstance(data, list) else []

          unresolved = load(".glitchtip-sweep/unresolved.json")
          resolved = load(".glitchtip-sweep/resolved.json")

          ensure_label()

          # Map existing GH issues by short_id encoded in the title prefix.
          existing_raw = subprocess.run(
              ["gh", "issue", "list", "--repo", REPO,
               "--label", LABEL, "--state", "all",
               "--limit", "200",
               "--json", "number,title,state,url"],
              check=True, capture_output=True, text=True,
          ).stdout
          existing = {}
          for row in json.loads(existing_raw):
              title = row.get("title", "")
              prefix = title.split(" ", 1)[0].strip()
              if prefix.startswith("[") and prefix.endswith("]"):
                  existing[prefix[1:-1]] = row

          for issue in unresolved:
              short_id = str(issue.get("shortId", ""))
              if not short_id:
                  continue
              # short_id is used as the dedup key (parsed back out of the
              # title prefix on the next run), so keep it raw in the prefix
              # and sanitise only the free-form title text after it.
              safe_title = _sanitize_title(str(issue.get("title", "")))[:120]
              title = f"[{short_id}] {safe_title}"
              first_seen = issue.get("firstSeen", "?")
              count = issue.get("count", "?")
              permalink = issue.get("permalink") or f"{BASE_URL}/{ORG}/issues/{short_id}"
              safe_link = _safe_permalink(permalink)
              link_line = (
                  f"- Link: {safe_link}"
                  if safe_link
                  else "- Link: (withheld: permalink host did not match the configured GlitchTip host)"
              )
              body = (
                  f"Auto-opened by `.github/workflows/glitchtip.yml`.\n\n"
                  f"- GlitchTip id: `{_code_span(short_id)}`\n"
                  f"- Level: `{_code_span(issue.get('level', '?'))}`\n"
                  f"- First seen: `{_code_span(first_seen)}`\n"
                  f"- Event count (24h): `{_code_span(count)}`\n"
                  f"{link_line}\n\n"
                  f"This issue auto-closes when the matching GlitchTip issue moves to resolved."
              )
              if short_id in existing:
                  row = existing[short_id]
                  if row.get("state") == "CLOSED":
                      subprocess.run(
                          ["gh", "issue", "reopen", str(row["number"]), "--repo", REPO],
                          check=True, capture_output=True,
                      )
                  subprocess.run(
                      ["gh", "issue", "edit", str(row["number"]),
                       "--repo", REPO, "--body", body],
                      check=True, capture_output=True,
                  )
              else:
                  subprocess.run(
                      ["gh", "issue", "create", "--repo", REPO,
                       "--title", title, "--label", LABEL, "--body", body],
                      check=True, capture_output=True,
                  )

          # Auto-close GH mirrors whose GlitchTip side is resolved.
          for issue in resolved:
              short_id = str(issue.get("shortId", ""))
              if not short_id or short_id not in existing:
                  continue
              row = existing[short_id]
              if row.get("state") == "OPEN":
                  subprocess.run(
                      ["gh", "issue", "close", str(row["number"]),
                       "--repo", REPO,
                       "--comment", "GlitchTip issue is resolved; closing the auto-opened mirror."],
                      check=True, capture_output=True,
                  )
          PY
