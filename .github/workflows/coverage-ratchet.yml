name: Coverage ratchet (total)

# LEVEL 2 of the coverage ratchet - total-coverage monotonic gate.
#
# The CI coverage shard already produces a Cobertura coverage.xml on every
# push to main and uploads it as the `coverage-report` artifact. This
# workflow consumes that *same* artifact (no parallel coverage system) and
# runs scripts/coverage_ratchet.py check:
#
#   - measured < committed baseline (beyond float tolerance): report a
#     drop. ADVISORY - the compare step is continue-on-error and this
#     workflow is NOT in the CI-gate required-check set, so a drop never
#     wedges the merge queue. Promote to blocking later (see the ops
#     runbook).
#   - measured > baseline: the ratchet clicks - bump .coverage-baseline.json
#     to the new high-water mark and open a PR with that one-line change.
#   - flat: no change.
#
# Why a PR (not a direct push): main is protected by required status
# checks, so a bot commit pushed straight to main would be rejected (it
# has not passed `CI gate`). Opening a PR is the protection-safe path and
# matches the repo convention (weekly floor bump). It also
# makes every baseline movement a reviewable, auditable artifact - the
# ratchet click is a PR, not a silent rewrite.
#
# Why the PR is opened with BERNSTEIN_AUTOSYNC_TOKEN and not GITHUB_TOKEN:
# a pull request created with GITHUB_TOKEN does not trigger workflows, so
# neither required context (`CI gate`, `review-bot-ack`) ever reports on
# it. The PR then reads MERGEABLE with a SUCCESS rollup while branch
# protection holds it at BLOCKED forever, and the only way out is for an
# operator to close it by hand. Closing it is what produced the apparent
# "one new PR per fire": the branch below is stable and the action does
# update the open PR in place, but a closed PR cannot be reopened by a
# force-push, so the next fire has to open a fresh one. Creating the PR
# under a token that triggers workflows lets it merge on its own and the
# churn stops at the source. The fallback to GITHUB_TOKEN keeps forks and
# secret-less environments working; there the PR still needs a manual
# close-and-reopen to collect its checks.
#
# Trigger: CI *completion* on main, not the push that started it.
#
# On a `push` trigger this workflow races the CI run it wants to measure:
# both start from the same event, and the resolve step reaches the
# artifact API long before the coverage shard has uploaded anything. The
# push-triggered version only ever found an artifact because it accepted
# whichever recent run happened to have one - i.e. a *different* commit's
# measurement. That is the mismatch this workflow exists to avoid, so the
# race and the provenance bug have to be fixed together: pinning the
# commit without moving the trigger would leave the ratchet correct and
# permanently idle.
#
# `types: [completed]` fires on every conclusion, cancelled included.
# That matters here: ci.yml's cancel-in-progress concurrency cancels most
# main runs, so filtering on `conclusion == success` would almost never
# fire - the reason the original implementation avoided `workflow_run`
# altogether. Not filtering on conclusion keeps the fallback while the
# event still hands us an exact `head_sha` and run id.
#
# Keeping the baseline-write here (not in ci.yml) means ci.yml's gate jobs
# never need `contents: write`.
#
# The baseline the ratchet commits records the raw Cobertura line-rate,
# the head_sha and the CI run id behind it, so the percentage in
# .coverage-baseline.json can be re-derived from the committed file alone
# (`scripts/coverage_ratchet.py verify`). A generated value should be
# reproducible from what is committed.
#
# Note: a `workflow_run` workflow always executes the copy of this file on
# the default branch, so edits here take effect only once merged to main.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

concurrency:
  # Serialise baseline writes so two back-to-back main pushes cannot race
  # on the commit. Never cancel an in-flight bump.
  group: coverage-ratchet
  cancel-in-progress: false

permissions: {}

jobs:
  ratchet:
    name: Total coverage ratchet
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Skip the merge of a baseline-bump PR this workflow opened (avoids a
    # self-retrigger loop on its own change). On workflow_run the commit
    # lives under the triggering run, not the top-level event.
    if: "!contains(github.event.workflow_run.head_commit.message, 'ratchet coverage baseline')"
    permissions:
      contents: write  # create the bump branch
      pull-requests: write  # open the baseline-bump PR
      actions: read  # list CI runs and download their coverage artifact
    steps:
      - name: Harden runner (audit mode)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The commit the triggering CI run measured - NOT `main`, which
          # has usually moved on by now, and not `github.sha`, which on a
          # workflow_run event is the default-branch head rather than the
          # measured commit. The tree we check out and the tree CI measured
          # must be the same commit.
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/bootstrap

      - name: Resolve the CI run that measured this commit
        id: ci_run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
          TRIGGERING_RUN: ${{ github.event.workflow_run.id }}
          TRIGGERING_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          set -euo pipefail
          # The triggering run has finished, so its coverage-report either
          # exists now or never will - no polling, no racing the upload.
          #
          # Every candidate must have head_sha == TARGET_SHA. Matching on
          # the artifact alone is what let a report for one commit justify
          # a bump recorded against another: the committed high-water mark
          # then described a tree nobody could identify, and the next
          # honest measurement read as a drop.
          #
          # Two ordered passes:
          #
          #   1. the triggering run itself - the ordinary case, and the
          #      one whose id and head_sha the event handed us directly.
          #   2. any *other* completed run for the same commit - the
          #      deliberate fallback. ci.yml's cancel-in-progress
          #      concurrency means the triggering run may have been
          #      cancelled before the coverage shard uploaded; a re-run or
          #      a superseded attempt on the same commit can still carry a
          #      usable report. Conclusion is not filtered in either pass,
          #      because insisting on `success` would idle the ratchet
          #      almost permanently under that same concurrency.
          #
          # Neither pass can reach a run for a different commit, so the
          # worst case is a *partial* report for the right commit. A
          # partial report understates coverage: it can cost a bump, never
          # manufacture one, and never attribute a measurement to the
          # wrong tree.
          has_coverage_artifact() {
            gh api "repos/${REPO}/actions/runs/$1/artifacts" --jq '.artifacts[].name' 2>/dev/null \
              | grep -qx coverage-report
          }

          found=""
          found_class=""
          if has_coverage_artifact "${TRIGGERING_RUN}"; then
            found="${TRIGGERING_RUN}"
            found_class="triggering"
          else
            echo "::notice::triggering CI run ${TRIGGERING_RUN} (${TRIGGERING_CONCLUSION}) has no coverage-report; looking for another run of ${TARGET_SHA}."
            siblings=$(gh run list \
                --repo "${REPO}" \
                --workflow ci.yml \
                --branch main \
                --limit 40 \
                --json databaseId,headSha,status \
                --jq '[.[] | select(.headSha == env.TARGET_SHA and .status == "completed") | .databaseId] | .[]')
            for run_id in ${siblings}; do
              if [ "${run_id}" = "${TRIGGERING_RUN}" ]; then
                continue
              fi
              if has_coverage_artifact "${run_id}"; then
                found="${run_id}"
                found_class="sibling"
                break
              fi
            done
          fi

          if [ -n "${found}" ]; then
            echo "coverage-report for ${TARGET_SHA} found in CI run ${found} (${found_class})"
            if [ "${found_class}" = "sibling" ]; then
              echo "::notice::using CI run ${found} rather than the triggering run; accepted because its head_sha still matches ${TARGET_SHA}."
            fi
            echo "run_id=${found}" >> "$GITHUB_OUTPUT"
            echo "head_sha=${TARGET_SHA}" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::no completed CI run for ${TARGET_SHA} carries a coverage-report artifact; skipping ratchet. The next commit's CI completion gets its own chance."
          fi

      - name: Download coverage report from the CI run
        if: steps.ci_run.outputs.run_id != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-report
          run-id: ${{ steps.ci_run.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true  # docs-only pushes skip the coverage shard

      - name: Run total-coverage ratchet
        id: ratchet
        continue-on-error: true  # ADVISORY: a drop reports red but never blocks
        env:
          HEAD_SHA: ${{ steps.ci_run.outputs.head_sha }}
          RUN_ID: ${{ steps.ci_run.outputs.run_id }}
        run: |
          if [ ! -f coverage.xml ] || [ ! -s coverage.xml ]; then
            echo "::warning::No usable coverage.xml available; skipping coverage ratchet for this push."
            exit 0
          fi
          # --head-sha / --run-id are recorded next to the measurement, so a
          # bumped baseline names the commit and run it came from.
          uv run python scripts/coverage_ratchet.py check \
            --coverage-xml coverage.xml \
            --baseline .coverage-baseline.json \
            --head-sha "${HEAD_SHA}" \
            --run-id "${RUN_ID}"

      - name: Verify the bumped baseline re-derives
        # Not continue-on-error: if the value we are about to commit cannot
        # be reproduced from the file that carries it, the PR must not open.
        if: steps.ratchet.outputs.baseline_bumped == 'true'
        run: |
          uv run python scripts/coverage_ratchet.py verify \
            --baseline .coverage-baseline.json \
            --require-provenance

      - name: Guard the open ratchet PR against a downward move
        id: guard
        if: steps.ratchet.outputs.baseline_bumped == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MEASURED: ${{ steps.ratchet.outputs.measured }}
          REPO: ${{ github.repository }}
          RATCHET_BRANCH: coverage-ratchet/baseline
        run: |
          set -euo pipefail
          # scripts/coverage_ratchet.py compares the measurement against the
          # baseline committed on main, NOT against the one the open ratchet
          # PR already carries. Those two diverge as soon as a ratchet PR is
          # open: main still holds the old mark while the PR branch holds a
          # higher one. A later push whose measurement lands between them
          # still counts as a bump against main, and force-pushing it would
          # rewrite the open PR with a LOWER high-water mark - the exact
          # inverse of a monotonic ratchet, and invisible in review because
          # the PR title changes with it.
          #
          # So: read the baseline on the ratchet branch and only proceed when
          # the new measurement is strictly greater.
          # gh prints the API error body to STDOUT on failure, so an
          # emptiness test on the captured output cannot detect a missing
          # branch: a 404 body parses as JSON and then fails on the absent
          # coverage key. Branch on the exit code instead, and separate a
          # missing ref (fine: the ratchet PR merged and its branch was
          # auto-deleted) from every other API failure (loud).
          set +e
          open_json=$(gh api "repos/${REPO}/contents/.coverage-baseline.json?ref=${RATCHET_BRANCH}" \
              -H "Accept: application/vnd.github.raw" 2>gh-err.txt)
          gh_rc=$?
          set -e
          if [ "${gh_rc}" -ne 0 ]; then
            if grep -qE "HTTP 404|No commit found|Not Found" gh-err.txt; then
              echo "::notice::no ${RATCHET_BRANCH} baseline (branch absent); opening a fresh ratchet PR."
              rm -f gh-err.txt
              echo "proceed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::could not read the open ratchet baseline (exit ${gh_rc}); refusing to guess."
            cat gh-err.txt
            rm -f gh-err.txt
            exit 1
          fi
          rm -f gh-err.txt
          printf '%s' "${open_json}" > open-baseline.json
          verdict=$(OPEN_BASELINE=open-baseline.json python3 - <<'PY'
          import json
          import os
          import sys

          with open(os.environ["OPEN_BASELINE"], encoding="utf-8") as fh:
              try:
                  open_pct = float(json.load(fh)["total_coverage_percent"])
              except (KeyError, ValueError, TypeError) as exc:
                  print(f"::error::open ratchet baseline is malformed: {exc!r}", file=sys.stderr)
                  raise SystemExit(1)
          measured = float(os.environ["MEASURED"])
          print(f"{'true' if measured > open_pct else 'false'} {open_pct}")
          PY
          )
          proceed=${verdict%% *}
          open_pct=${verdict##* }
          rm -f open-baseline.json
          if [ "${proceed}" = "true" ]; then
            echo "::notice::measured ${MEASURED}% > open ratchet PR ${open_pct}%; updating it."
          else
            echo "::notice::measured ${MEASURED}% is not above the open ratchet PR's ${open_pct}%; leaving it alone."
          fi
          echo "proceed=${proceed}" >> "$GITHUB_OUTPUT"

      - name: Open PR with the bumped baseline
        # Only when the ratchet actually clicked (coverage rose) AND the new
        # mark is above whatever the currently-open ratchet PR carries.
        # The check step rewrote .coverage-baseline.json in place; open a PR
        # with that change (main is protected, so a direct push would be
        # rejected).
        if: >-
          steps.ratchet.outputs.baseline_bumped == 'true' &&
          steps.guard.outputs.proceed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          # A PR opened with GITHUB_TOKEN never triggers the workflows that
          # publish `CI gate` and `review-bot-ack`, so it can never satisfy
          # branch protection. See the header block.
          token: ${{ secrets.BERNSTEIN_AUTOSYNC_TOKEN || secrets.GITHUB_TOKEN }}
          # The checkout above is a detached commit (the measured SHA), so
          # create-pull-request cannot infer the base branch and hard-fails
          # without an explicit one (issue #3434). The ratchet's base was
          # always main - the guard step reasons about "the baseline
          # committed on main".
          base: main
          # Stable branch so create-pull-request UPDATES the single open
          # ratchet PR in place instead of opening a fresh PR every push.
          branch: coverage-ratchet/baseline
          delete-branch: true
          add-paths: |
            .coverage-baseline.json
          commit-message: |
            chore(ci): ratchet coverage baseline up to ${{ steps.ratchet.outputs.measured }}%
          title: "chore(ci): ratchet coverage baseline up to ${{ steps.ratchet.outputs.measured }}%"
          body: |
            Total line coverage rose on `main`, so the monotonic ratchet
            bumped the committed high-water mark in `.coverage-baseline.json`
            to **${{ steps.ratchet.outputs.measured }}%**.

            Measured on `${{ steps.ci_run.outputs.head_sha }}` from the
            `coverage-report` artifact of CI run
            [${{ steps.ci_run.outputs.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ steps.ci_run.outputs.run_id }}).
            Those, and the raw Cobertura `line-rate` the percentage was
            rounded from, are recorded in the baseline, so the number in the
            diff can be re-derived from the file itself:

            ```bash
            uv run python scripts/coverage_ratchet.py verify \
                --baseline .coverage-baseline.json --require-provenance
            ```

            From here, any later push whose total coverage falls below this
            mark is flagged by the LEVEL 2 ratchet. The gate stays advisory
            until promoted; see `docs/operations/coverage-ratchet.md`.

            Generated by `.github/workflows/coverage-ratchet.yml`.
          labels: |
            ci
            chore
