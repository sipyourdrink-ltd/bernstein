name: Coverage ratchet (total)

# LEVEL 2 of the coverage ratchet - total-coverage monotonic gate.
#
# The CI coverage shard already produces a Cobertura coverage.xml on every
# push to main and uploads it as the `coverage-report` artifact. This
# workflow consumes that *same* artifact (no parallel coverage system) and
# runs scripts/coverage_ratchet.py check:
#
#   - measured < committed baseline (beyond float tolerance): report a
#     drop. ADVISORY - the compare step is continue-on-error and this
#     workflow is NOT in the CI-gate required-check set, so a drop never
#     wedges the merge queue. Promote to blocking later (see the ops
#     runbook).
#   - measured > baseline: the ratchet clicks - bump .coverage-baseline.json
#     to the new high-water mark and open a PR with that one-line change.
#   - flat: no change.
#
# Why a PR (not a direct push): main is protected by required status
# checks, so a bot commit pushed straight to main would be rejected (it
# has not passed `CI gate`). Opening a PR is the protection-safe path and
# matches the repo convention (weekly floor bump). It also
# makes every baseline movement a reviewable, auditable artifact - the
# ratchet click is a PR, not a silent rewrite.
#
# Why the PR is opened with BERNSTEIN_AUTOSYNC_TOKEN and not GITHUB_TOKEN:
# a pull request created with GITHUB_TOKEN does not trigger workflows, so
# neither required context (`CI gate`, `review-bot-ack`) ever reports on
# it. The PR then reads MERGEABLE with a SUCCESS rollup while branch
# protection holds it at BLOCKED forever, and the only way out is for an
# operator to close it by hand. Closing it is what produced the apparent
# "one new PR per fire": the branch below is stable and the action does
# update the open PR in place, but a closed PR cannot be reopened by a
# force-push, so the next fire has to open a fresh one. Creating the PR
# under a token that triggers workflows lets it merge on its own and the
# churn stops at the source. The fallback to GITHUB_TOKEN keeps forks and
# secret-less environments working; there the PR still needs a manual
# close-and-reopen to collect its checks.
#
# Trigger: push to main, then resolve the freshest CI run that actually
# uploaded a coverage-report artifact. Under the rapid-merge cadence
# ci.yml's cancel-in-progress concurrency cancels
# most main CI runs, so a `workflow_run`/`conclusion == success` trigger
# almost never fires. Searching recent runs for the artifact (cancelled
# runs may still have uploaded it) is the robust pattern. Keeping the
# baseline-write here (not in ci.yml) means ci.yml's gate jobs never need
# `contents: write`.

on:
  push:
    branches: [main]

concurrency:
  # Serialise baseline writes so two back-to-back main pushes cannot race
  # on the commit. Never cancel an in-flight bump.
  group: coverage-ratchet
  cancel-in-progress: false

permissions: {}

jobs:
  ratchet:
    name: Total coverage ratchet
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Skip the merge of a baseline-bump PR this workflow opened (avoids a
    # self-retrigger loop on its own change).
    if: "!contains(github.event.head_commit.message, 'ratchet coverage baseline')"
    permissions:
      contents: write  # create the bump branch
      pull-requests: write  # open the baseline-bump PR
      actions: read  # list CI runs and download their coverage artifact
    steps:
      - name: Harden runner (audit mode)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/bootstrap

      - name: Resolve latest CI run with a coverage artifact
        id: ci_run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Search the last 20 main CI runs for one that uploaded the
          # coverage-report artifact. Cancelled runs can still have
          # uploaded it if the coverage step ran before cancellation, so
          # we do not filter by status.
          found=""
          for run_id in $(gh run list \
              --repo "${{ github.repository }}" \
              --workflow ci.yml \
              --branch main \
              --limit 20 \
              --json databaseId \
              --jq '.[].databaseId'); do
            artifacts=$(gh api "repos/${{ github.repository }}/actions/runs/$run_id/artifacts" \
                --jq '.artifacts[].name' 2>/dev/null || true)
            if printf '%s\n' "$artifacts" | grep -qx coverage-report; then
              found="$run_id"
              break
            fi
          done
          if [ -n "$found" ]; then
            echo "Found coverage-report artifact in CI run: $found"
            echo "run_id=$found" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No recent CI run with a coverage-report artifact; skipping ratchet."
          fi

      - name: Download coverage report from the CI run
        if: steps.ci_run.outputs.run_id != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-report
          run-id: ${{ steps.ci_run.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true  # docs-only pushes skip the coverage shard

      - name: Run total-coverage ratchet
        id: ratchet
        continue-on-error: true  # ADVISORY: a drop reports red but never blocks
        run: |
          if [ ! -f coverage.xml ] || [ ! -s coverage.xml ]; then
            echo "::warning::No usable coverage.xml available; skipping coverage ratchet for this push."
            exit 0
          fi
          uv run python scripts/coverage_ratchet.py check \
            --coverage-xml coverage.xml \
            --baseline .coverage-baseline.json

      - name: Guard the open ratchet PR against a downward move
        id: guard
        if: steps.ratchet.outputs.baseline_bumped == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MEASURED: ${{ steps.ratchet.outputs.measured }}
          REPO: ${{ github.repository }}
          RATCHET_BRANCH: coverage-ratchet/baseline
        run: |
          set -euo pipefail
          # scripts/coverage_ratchet.py compares the measurement against the
          # baseline committed on main, NOT against the one the open ratchet
          # PR already carries. Those two diverge as soon as a ratchet PR is
          # open: main still holds the old mark while the PR branch holds a
          # higher one. A later push whose measurement lands between them
          # still counts as a bump against main, and force-pushing it would
          # rewrite the open PR with a LOWER high-water mark - the exact
          # inverse of a monotonic ratchet, and invisible in review because
          # the PR title changes with it.
          #
          # So: read the baseline on the ratchet branch and only proceed when
          # the new measurement is strictly greater.
          open_json=$(gh api "repos/${REPO}/contents/.coverage-baseline.json?ref=${RATCHET_BRANCH}" \
              -H "Accept: application/vnd.github.raw" 2>/dev/null || true)
          if [ -z "${open_json}" ]; then
            echo "::notice::no ${RATCHET_BRANCH} branch yet; opening a fresh ratchet PR."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s' "${open_json}" > open-baseline.json
          verdict=$(OPEN_BASELINE=open-baseline.json python3 - <<'PY'
          import json
          import os

          with open(os.environ["OPEN_BASELINE"], encoding="utf-8") as fh:
              open_pct = float(json.load(fh)["total_coverage_percent"])
          measured = float(os.environ["MEASURED"])
          print(f"{'true' if measured > open_pct else 'false'} {open_pct}")
          PY
          )
          proceed=${verdict%% *}
          open_pct=${verdict##* }
          rm -f open-baseline.json
          if [ "${proceed}" = "true" ]; then
            echo "::notice::measured ${MEASURED}% > open ratchet PR ${open_pct}%; updating it."
          else
            echo "::notice::measured ${MEASURED}% is not above the open ratchet PR's ${open_pct}%; leaving it alone."
          fi
          echo "proceed=${proceed}" >> "$GITHUB_OUTPUT"

      - name: Open PR with the bumped baseline
        # Only when the ratchet actually clicked (coverage rose) AND the new
        # mark is above whatever the currently-open ratchet PR carries.
        # The check step rewrote .coverage-baseline.json in place; open a PR
        # with that change (main is protected, so a direct push would be
        # rejected).
        if: >-
          steps.ratchet.outputs.baseline_bumped == 'true' &&
          steps.guard.outputs.proceed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          # A PR opened with GITHUB_TOKEN never triggers the workflows that
          # publish `CI gate` and `review-bot-ack`, so it can never satisfy
          # branch protection. See the header block.
          token: ${{ secrets.BERNSTEIN_AUTOSYNC_TOKEN || secrets.GITHUB_TOKEN }}
          # Stable branch so create-pull-request UPDATES the single open
          # ratchet PR in place instead of opening a fresh PR every push.
          branch: coverage-ratchet/baseline
          delete-branch: true
          add-paths: |
            .coverage-baseline.json
          commit-message: |
            chore(ci): ratchet coverage baseline up to ${{ steps.ratchet.outputs.measured }}%
          title: "chore(ci): ratchet coverage baseline up to ${{ steps.ratchet.outputs.measured }}%"
          body: |
            Total line coverage rose on `main`, so the monotonic ratchet
            bumped the committed high-water mark in `.coverage-baseline.json`
            to **${{ steps.ratchet.outputs.measured }}%**.

            From here, any later push whose total coverage falls below this
            mark is flagged by the LEVEL 2 ratchet. The gate stays advisory
            until promoted; see `docs/operations/coverage-ratchet.md`.

            Generated by `.github/workflows/coverage-ratchet.yml`.
          labels: |
            ci
            chore
