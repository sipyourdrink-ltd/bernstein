# Volunteer hub deployment
#
# Architecture:
#   bernstein-server   - task API + dashboard (internal only, not exposed to internet)
#   bernstein-hub      - volunteer hub HTTP surface (internal only, proxied by Caddy)
#   caddy              - HTTPS reverse proxy, public-facing on 80/443
#
# Setup:
#   1. cp docker/volunteer-hub/.env.example docker/volunteer-hub/.env
#   2. Fill in ANTHROPIC_API_KEY, OPENAI_API_KEY, BERNSTEIN_AUTH_TOKEN, HUB_DOMAIN
#   3. Point HUB_DOMAIN DNS at this server
#   4. docker compose -f docker/volunteer-hub/docker-compose.yaml --env-file docker/volunteer-hub/.env up -d
#
# The hub dashboard is served at https://<HUB_DOMAIN>/dashboard

services:
  # ── Task server ──────────────────────────────────────────────────────────
  # Serves the task API. NOT exposed directly to the internet —
  # Caddy proxies only read-only paths to the public.
  bernstein-server:
    build:
      context: ../..
      dockerfile: docker/volunteer-hub/Dockerfile
    entrypoint: ["python", "-m", "uvicorn"]
    command:
      - "bernstein.core.server:app"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8052"
    volumes:
      - sdd-data:/workspace/.sdd
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8052/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # ── Volunteer hub HTTP surface ──────────────────────────────────────────
  # Serves the volunteer hub API and dashboard endpoints on port 8053.
  # Not exposed directly — Caddy proxies read-only paths to the public.
  bernstein-hub:
    build:
      context: ../..
      dockerfile: docker/volunteer-hub/Dockerfile
    entrypoint: ["python", "-m", "bernstein"]
    command:
      - "volunteer"
      - "hub"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8053"
    environment:
      BERNSTEIN_SERVER_URL: http://bernstein-server:8052
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      BERNSTEIN_AUTH_TOKEN: ${BERNSTEIN_AUTH_TOKEN:-}
    volumes:
      - sdd-data:/workspace/.sdd
    depends_on:
      bernstein-server:
        condition: service_healthy
    restart: unless-stopped

  # ── Public HTTPS reverse proxy ──────────────────────────────────────────
  # Caddy handles TLS automatically (Let's Encrypt) and exposes only
  # read-only dashboard/event paths to the public internet.
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      bernstein-server:
        condition: service_healthy
    restart: unless-stopped

volumes:
  sdd-data:
    driver: local
  caddy-data:
    driver: local
  caddy-config:
    driver: local
