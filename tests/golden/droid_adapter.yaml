# Golden transcript for the Droid (Factory AI) adapter.
#
# Pins the observable spawn outcome for the invocation surface the
# contract in tests/contract/contracts/droid.yaml declares
# (``droid <prompt>``): a SpawnResult carrying the child PID and a log
# path under the worktree's .sdd/runtime/ directory. Replayed under a
# mocked subprocess, so the transcript covers adapter-controlled
# invocation only and never upstream model text.
name: droid_adapter_spawn
adapter_class: bernstein.adapters.droid.DroidAdapter
steps:
  - prompt: "implement feature X"
    model: "claude-sonnet-4-6"
    expected_pid: 6101
    expected_log_suffix: "conformance-0.log"
  - prompt: "run the test suite"
    model: "gpt-5"
    expected_pid: 6102
    expected_log_suffix: "conformance-1.log"
