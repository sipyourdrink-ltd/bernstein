# Golden transcript for the Kimi CLI adapter.
#
# Pins the observable spawn outcome for the invocation surface the
# contract in tests/contract/contracts/kimi.yaml declares
# (``kimi --yolo -c <prompt>``): a SpawnResult carrying the child PID and
# a log path under the worktree's .sdd/runtime/ directory. Replayed under
# a mocked subprocess, so the transcript covers adapter-controlled
# invocation only and never upstream model text.
name: kimi_adapter_spawn
adapter_class: bernstein.adapters.kimi.KimiAdapter
steps:
  - prompt: "implement feature X"
    model: "kimi-k2-turbo-preview"
    expected_pid: 6201
    expected_log_suffix: "conformance-0.log"
  - prompt: "run the test suite"
    model: "kimi-k2-turbo-preview"
    expected_pid: 6202
    expected_log_suffix: "conformance-1.log"
