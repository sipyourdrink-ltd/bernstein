# Contract for the OpenCode CLI (adapter: opencode).
#
# Always-passed surface from src/bernstein/adapters/opencode.py:
# ``opencode run -m <model> --format json --auto <prompt>``.
#
# ``--auto`` is the escalating permission flag; it is dropped and the
# OPENCODE_PERMISSION policy tightened when the adapter's declared
# dangerous-mode strategy does not escalate. ``--continue`` is passed only on
# a continuation retry, so it is required of the binary but not of every spawn.
adapter: opencode
binary: opencode
install:
  method: npm
  spec: "opencode-ai@latest"
auth:
  required_for_help: false
  required_for_models: false
  secret_env: "OPENROUTER_API_KEY"
required_flags:
  - "-m"
  - "--format"
  - "--auto"
  - "--continue"
required_subcommands:
  - "run"
# Opencode sub-flags live under ``opencode run --help``.
help_command: ["opencode", "run", "--help"]
expected_models:
  command: []
  required_present: []
