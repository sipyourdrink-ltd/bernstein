# Contract for the gpt-researcher adapter (adapter: gpt_researcher).
#
# The adapter runs gpt_researcher_runner.py, a standalone script shipped with
# bernstein, under the interpreter gpt-researcher is installed in; the runner's
# own command line is the surface asserted here.
adapter: gpt_researcher
binary: python3
install:
  method: none
  spec: ""
auth:
  required_for_help: false
  required_for_models: false
  secret_env: ""
  basis: unknown
required_flags:
  - "--prompt-file"
  - "--out-dir"
  - "--report-type"
required_subcommands: []
expected_models:
  command: []
  required_present: []
