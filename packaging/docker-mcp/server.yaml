# Docker MCP catalog entry for bernstein (#2369).
#
# This file is the submission payload for the Docker MCP catalog
# (github.com/docker/mcp-registry, servers/bernstein/server.yaml). It is
# kept in-tree so the catalog entry is generated from the repository that
# builds the image, not hand-maintained in a fork. See README.md in this
# directory for the submission flow.
name: bernstein
image: ghcr.io/sipyourdrink-ltd/bernstein
type: server
meta:
  category: devops
  tags:
    - orchestration
    - multi-agent
    - coding-agents
    - ci
about:
  title: Bernstein
  description: >-
    Deterministic orchestrator for CLI coding agents. Submit a goal and
    Bernstein decomposes it into tasks, runs agents in per-task git worktrees,
    and records every run in a replay journal with lineage tracking and an
    opt-in HMAC-chained audit log. No model sits in the coordination loop, so
    the same plan replays byte-identically. The signature and Merkle legs of
    verification check from the on-disk artefacts alone; replaying the HMAC
    chain needs the install's audit key. Adapters ship for Claude Code, Codex,
    Gemini CLI, Aider, OpenHands and 40+ other agent CLIs. The MCP server
    exposes 14 tools covering run control, task listing and claiming, progress
    updates, artifact posting, approvals, subtasks, cost reporting, and skill
    loading.
  icon: https://avatars.githubusercontent.com/u/271707709?v=4
source:
  project: https://github.com/sipyourdrink-ltd/bernstein
  # The catalog validator requires a pinned commit. Refresh this to the
  # release commit being submitted before opening the catalog PR.
  commit: ec2c1306eba4f51ace107382dab495156e7f20e6
run:
  # The published image sets ENTRYPOINT ["bernstein"], and the catalog
  # appends run.command after the image reference. Naming the binary here
  # as well executes `bernstein bernstein mcp`, which exits with
  # "No such command 'bernstein'". Only the subcommand belongs here.
  command:
    - mcp
