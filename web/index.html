<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <title>Bernstein</title>
    <meta name="description" content="Operator GUI for the Bernstein orchestrator" />

    <!-- PWA wiring (#1218): manifest + Apple-touch icon + theme colour
         used by Safari/Chromium for the status bar tint. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/ui/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Bernstein" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#111111" />
    <script id="theme-bootstrap">
      (() => {
        try {
          const root = document.documentElement;
          let theme = 'system';

          try {
            const storedTheme = window.localStorage.getItem('bernstein-theme');
            if (storedTheme === 'dark' || storedTheme === 'light' || storedTheme === 'system') {
              theme = storedTheme;
            }
          } catch {
            // Storage can be blocked in private browsing; use the system preference instead.
          }

          if (theme === 'system') {
            try {
              theme =
                typeof window.matchMedia !== 'function'
                  ? 'dark'
                  : window.matchMedia('(prefers-color-scheme: dark)').matches
                    ? 'dark'
                    : 'light';
            } catch {
              theme = 'dark';
            }
          }

          root.classList.remove('light', 'dark');
          root.classList.add(theme);
        } catch {
          // This runs before hydration, so a hostile browser environment must not block rendering.
        }
      })();
    </script>

    <link
      rel="icon"
      href="data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='80 80 640 640'%3E%3Cpath fill='%23F5A524' fill-rule='evenodd' d='M 375.00 116.70 A 50 50 0 0 1 425.00 116.70 L 632.85 236.70 A 50 50 0 0 1 657.85 280.00 L 657.85 520.00 A 50 50 0 0 1 632.85 563.30 L 425.00 683.30 A 50 50 0 0 1 375.00 683.30 L 167.15 563.30 A 50 50 0 0 1 142.15 520.00 L 142.15 280.00 A 50 50 0 0 1 167.15 236.70 Z M 216 290 L 433 400 L 216 510 L 216 450 L 315 400 L 216 350 Z M 453 452 H 583 V 510 H 453 Z'/%3E%3C/svg%3E"
    />
  </head>
  <body class="bg-background text-foreground antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
