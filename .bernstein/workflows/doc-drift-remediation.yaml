# Detect and repair documentation drift against live CLI commands and schemas.
name: doc-drift-remediation
version: "1.0.0"

phases:
  - name: scan
    allowed_roles: [analyst, qa]
  - name: update
    allowed_roles: [docs]
  - name: verify
    allowed_roles: [qa, reviewer]

nodes:
  extract-surface-facts:
    phase: scan
    role: analyst
    description: "Compare documented CLI flags, config keys, and OpenAPI routes with live code"
    estimated_minutes: 25

  patch-guides-and-examples:
    phase: update
    role: docs
    description: "Update drifted guides, reference tables, and runnable examples"
    estimated_minutes: 40
    depends_on:
      - extract-surface-facts

  strict-docs-and-link-gate:
    phase: verify
    role: qa
    description: "Run mkdocs --strict, link hygiene, and l10n binding checks"
    estimated_minutes: 20
    depends_on:
      - patch-guides-and-examples
