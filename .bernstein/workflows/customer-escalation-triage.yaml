# Sanitized customer escalation reproduction, fix, regression gate, and RCA draft.
name: customer-escalation-triage
version: "1.0.0"

phases:
  - name: reproduce
    allowed_roles: [analyst, qa]
  - name: fix
  - name: verify
    allowed_roles: [qa, reviewer, security]
  - name: communicate
    allowed_roles: [docs]

nodes:
  build-sanitized-repro:
    phase: reproduce
    role: analyst
    description: "Distill PII-free minimal failing reproduction from escalation telemetry"
    estimated_minutes: 25

  implement-root-cause-fix:
    phase: fix
    role: backend
    description: "Fix underlying defect and add permanent regression test"
    estimated_minutes: 40
    depends_on:
      - build-sanitized-repro

  verify-fix-and-boundaries:
    phase: verify
    role: qa
    description: "Run reproduction, adjacent edge cases, and full regression suite"
    estimated_minutes: 25
    depends_on:
      - implement-root-cause-fix

  rework-escalation-fix:
    phase: fix
    role: backend
    description: "Address edge-case or regression failure"
    depends_on:
      - source: verify-fix-and-boundaries
        condition: "status == 'failed'"
    retry:
      max_attempts: 3
      until: "status == 'done'"

  reverify-escalation-fix:
    phase: verify
    role: qa
    description: "Re-run sanitized reproduction, adjacent edge cases, and regression suite after rework"
    estimated_minutes: 20
    depends_on:
      - rework-escalation-fix

  draft-customer-rca:
    phase: communicate
    role: docs
    description: "Write verified customer RCA summary and upgrade steps for human review"
    estimated_minutes: 20
    depends_on:
      - source: verify-fix-and-boundaries
        condition: "status == 'done'"
      - source: reverify-escalation-fix
        condition: "status == 'done'"
