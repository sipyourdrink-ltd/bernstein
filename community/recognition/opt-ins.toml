# Who has said yes to being named in the consolidated LinkedIn post.
#
# One [[contributor]] block per person, edited by the maintainer from the
# BRNSTN-PR-LNKD queue (scripts/contributor_recognition.py parse-reply prints a
# block to paste). A login listed twice is an error. `source` says where the
# consent came from; the first six are the explicit replies in discussion
# #5524 and were not asked again.
#
#   opt_in                 named in the LinkedIn post (false = taken out again)
#   recommendation         asked for a LinkedIn recommendation from the maintainer
#   review_before_publish  send the final wording before it goes out
#   exception              included although below the soft gate (maintainer decision, note why)

[exclusions]
