id: disaster-recovery-failover-drill
name: Disaster Recovery and Backup Restore Drill
version: "1.0"
description: |
  Prove backup and WAL restore readiness inside an isolated sandbox environment,
  measuring actual RTO/RPO and verifying hash-chain and schema integrity without
  touching live production state.
tags: [ops, sre, disaster-recovery, backup, compliance]
tasks:
  - title: Inventory backup snapshots, encryption state, and target RTO/RPO
    role: devops
    priority: 0
    scope: small
    complexity: low
    description: |
      Verify snapshot recency, retention policy, and network isolation of the
      temporary restore sandbox.
  - title: Execute cold restore from runbook alone and time RTO/RPO
    role: devops
    priority: 1
    scope: medium
    complexity: medium
    description: |
      Run the documented restore procedure without undocumented manual fixes and
      record exact wall-clock recovery time and data-loss window.
  - title: Validate restored ledger checksums and application smoke probes
    role: qa
    priority: 1
    scope: medium
    complexity: medium
    description: |
      Verify database invariants, audit-log hash chains, and read-only service
      health endpoints against the restored state.
  - title: Confirm clean sandbox teardown and file DR readiness receipt
    role: security
    priority: 2
    scope: small
    complexity: low
    description: |
      Verify zero residual snapshots or secrets remain in temporary storage and
      sign off the DR drill evidence report.
