# Built-in team manifest for security reviews, red-team passes, and advisory hardening.
#
# Pairs security, adversary, reviewer, and docs so findings are reproduced,
# challenged, and documented with verifiable evidence.

name = "security-audit"
version = "1.0.0"

[coordination]
parallelism = 3
review_chain = true

[[roles]]
response_profile = "balanced"
role = "security"

[roles.model_policy]
effort = "max"
model = "opus"

[[roles]]
response_profile = "balanced"
role = "adversary"

[roles.model_policy]
effort = "high"
model = "opus"

[[roles]]
response_profile = "terse"
role = "reviewer"

[roles.model_policy]
effort = "high"
model = "sonnet"

[[roles]]
response_profile = "balanced"
role = "docs"

[roles.model_policy]
effort = "medium"
model = "sonnet"

