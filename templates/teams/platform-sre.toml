# Built-in team manifest for incident response, disaster-recovery drills, and release reliability.

name = "platform-sre"
version = "1.0.0"

[coordination]
parallelism = 4
review_chain = true

[[roles]]
response_profile = "balanced"
role = "devops"

[roles.model_policy]
effort = "high"
model = "sonnet"

[[roles]]
response_profile = "balanced"
role = "backend"

[roles.model_policy]
effort = "high"
model = "sonnet"

[[roles]]
response_profile = "terse"
role = "security"

[roles.model_policy]
effort = "high"
model = "opus"

[[roles]]
response_profile = "terse"
role = "qa"

[roles.model_policy]
effort = "high"
model = "sonnet"

[[roles]]
response_profile = "balanced"
role = "docs"

[roles.model_policy]
effort = "medium"
model = "sonnet"

