# Built-in team manifest for non-code deliverables: research, RFPs, and audit packs.
#
# Pairs analyst, retrieval, architect, and docs for artifact-contract runs.

name = "research-ops"
version = "1.0.0"

[coordination]
parallelism = 4
review_chain = true

[[roles]]
response_profile = "balanced"
role = "analyst"

[roles.model_policy]
effort = "high"
model = "opus"

[[roles]]
response_profile = "terse"
role = "retrieval"

[roles.model_policy]
effort = "medium"
model = "sonnet"

[[roles]]
response_profile = "balanced"
role = "architect"

[roles.model_policy]
effort = "high"
model = "opus"

[[roles]]
response_profile = "balanced"
role = "docs"

[roles.model_policy]
effort = "high"
model = "sonnet"

