# Built-in team manifest for full-stack web + API delivery.
#
# Pairs architect, backend, frontend, qa, and security under review-chain
# coordination. Verify with `bernstein team show fullstack`.

name = "fullstack"
version = "1.0.0"

[coordination]
parallelism = 4
review_chain = true

[[roles]]
response_profile = "balanced"
role = "architect"

[roles.model_policy]
effort = "high"
model = "opus"

[[roles]]
response_profile = "balanced"
role = "backend"

[roles.model_policy]
effort = "high"
model = "sonnet"

[[roles]]
response_profile = "balanced"
role = "frontend"

[roles.model_policy]
effort = "high"
model = "sonnet"

[[roles]]
response_profile = "terse"
role = "qa"

[roles.model_policy]
effort = "high"
model = "sonnet"

[[roles]]
response_profile = "balanced"
role = "security"

[roles.model_policy]
effort = "max"
model = "opus"

