name: disaster-recovery-drill
description: "Rehearse isolated backup restore, measure RTO/RPO, verify integrity, and always tear down the sandbox."
version: "1.1.0"
nodes:
  - id: isolated-restore
    agent: devops
    prompt: |
      Stand up an isolated restore target, execute the documented backup restore
      procedure, and record elapsed RTO and RPO for: {goal}
    timeout_seconds: 2400
  - id: integrity-verification
    depends_on: [isolated-restore]
    agent: qa
    prompt: |
      Verify restored database checksums, audit-log hash chains, and smoke
      probes for: {goal}
    fresh_context: true
    timeout_seconds: 1800
  - id: sandbox-disposal
    depends_on: [isolated-restore, integrity-verification]
    always_run: true
    agent: security
    prompt: |
      Tear down temporary restore targets and volumes and confirm zero residual
      secrets or restored backup artifacts remain (even after a failed restore
      or verification) for: {goal}
    timeout_seconds: 1200
  - id: dr-receipt
    depends_on: [integrity-verification, sandbox-disposal]
    agent: docs
    prompt: |
      Issue the dated DR readiness receipt with measured RTO/RPO, integrity
      verification evidence, and disposal confirmation for: {goal}
    timeout_seconds: 900
